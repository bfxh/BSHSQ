name: ci

# 门禁分层（V2 §5 + M1 静态层）：
#   ① 提交门（四门禁）：{测试 + clippy + fmt} × 三编译器矩阵、miri、loom、TSan、ASan；
#   ② 静态层：文本/工作流（typos / actionlint / zizmor / 纪律扫描 / 词汇）、
#      依赖图（本仓依赖红线 deps_lock.py / cargo-deny / cargo-machete）、文档与强化
#      lint（rustdoc -D warnings、clippy 强化档）；
#   ③ 确定性层：三编译器 + aarch64 的跨平台哈希比对；
#   ④ 报告层（不阻断）：覆盖率。
# 汇总门 `gates-summary` 把 ①②③ 收敛成**一个状态**——Free 私有仓无「必需检查」
# 功能，单状态即事实上的分支门（任一前置门未成功 → 汇总红）。
#
# 安全基线（zizmor 审计）：workflow 级 `permissions: contents: read` 最小权限、
# checkout `persist-credentials: false`（凭据不落盘）、第三方 action 全部按 commit
# SHA 固定（唯一例外 = dtolnay/rust-toolchain：其 stable/nightly 分支即工具链入口，
# 也按分支 tip 的 commit SHA 固定——⚠️ 维护须知：该仓**频繁 force-push**，旧 SHA 会被
# GC 出历史 ⇒ zizmor 在线审计 `impostor-commit` 报"commit with no history"使**全仓 CI 红**
# （2026-10-02 实判，main 同红）。刷新程序：gh api repos/dtolnay/rust-toolchain/commits/{stable,nightly}
# 取新 tip，替换本文件全部 dtolnay 引用（stable ×3 / nightly ×1），本地
# `GH_TOKEN=$(gh auth token) zizmor --persona=regular .` 验绿即可）。
#
# 成本控制（2026-09-13 立，**2026-10-04 更正理由**）：当初的理由写的是"私有仓 Actions 分钟计费"，
# 但本仓**现已是公开仓**（issue #4 备注："公开仓 Actions 不限分钟"）⇒ 分钟数不再是约束。
# 下面四条**照旧保留**，因为它们省的是另外两样东西（不是钱）：
#   · **wall-clock**：矩阵有 GCC/Clang/MSVC、aarch64-qemu、TSan/ASan/miri、覆盖率——
#     全量一轮 ~40 分钟，高频推送下不取消旧运行就会排队；
#   · **runner 分配与缓存抖动**：零编译的文本层合并成一个 job，少几次 runner 起停。
# 纪律不变：**改动引擎代码的任何提交仍跑全部门禁**（不许拿"省钱"当跳门理由——现在没这个理由了）。
# ① 同分支新推送自动取消旧运行（高频推送下旧运行不再烧完整管线）；
# ② 纯文档/工具目录改动跳过（docs/**、**/*.md、gold-sample/** 不产出引擎
#    二进制，门禁无判定力；gold-sample 为独立包不进 workspace）；
# ③ 编译类 job 统一挂 rust-cache（Cargo.lock 键控）；
# ④ 零编译的文本层检查合并在一个 job 内（省 runner 分配开销）；
# ⑤ **分支推送不再触发全量**（2026-10-04 实测：同一 commit 被 `push` 与 `pull_request`
#    各跑一遍 20 个 job ⇒ 双份 runner 占用 + 排队，两份结论完全相同）。现在
#    **分支的权威判定 = 它那条 PR 的 run**；合进 main 的那次 push 仍跑全量（留档）。
#    ⚠️ 代价要说清：**没开 PR 的分支 = 没有 CI**（main 未设分支保护，拦不住直接推）。
#    兜底两条：⑴ 要过门就开 PR（本仓历史全部走 PR，见 git log）；⑵ 无 PR 的分支用
#    `gh workflow run ci.yml --ref <分支>` 手动补一次全量（`workflow_dispatch` 仍在）。
on:
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "gold-sample/**"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "gold-sample/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 最小权限：全部 job 只读仓库内容（无需写权限；产物上传由 action 自身完成）。
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # 本机常备 `.cargo/config.toml`（非 ASCII 路径规避：target-dir = C:/vxl-wl-target，
  # 该文件在 .gitignore 内、不入仓）。此处显式固定 CI 的 target 目录：既让缓存与
  # 产物路径符合预期，也让「哪天本地配置被误提交」不至于在 runner 上造出 `C:` 目录。
  CARGO_TARGET_DIR: target

jobs:
  # ==================== 静态层 ①：文本与工作流（零编译，单 job 合并） ====================
  static-text:
    name: 静态 (文本/工作流/纪律)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # 工具逐个安装（首次 CI 实测：合并写法 `tool: a,b,c` 在安装步失败——exit 76；
      # 拆成独立步骤后失败可归因到具体工具，且各自的 manifest/版本独立解析）。
      - name: 安装 typos
        uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2.87.12
        with:
          # **钉版本**（2026-09-21 实测教训：install-action 默认装 @latest，日志里赫然写着
          # `installing cargo-machete@latest`——工具自己发新版就能把分支判红而代码没动过）。
          # 版本取当次 CI 日志里的实际安装版本；升级=改这一行（一次有意动作）。
          tool: typos@1.50.1
      - name: 安装 actionlint（Go 工具，install-action 无此条目 ⇒ 取 release 资产 + 校验哈希）
        env:
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          curl -sSL -o actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar xzf actionlint.tar.gz actionlint
          sudo install -m 0755 actionlint /usr/local/bin/actionlint
          actionlint --version
      - name: 安装 zizmor
        uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2.87.12
        with:
          tool: zizmor@1.30.1     # 钉版本，理由同 typos（@latest 会自己漂）
      - name: 拼写（typos；豁免项见 _typos.toml）
        run: typos .
      - name: 工作流语法（actionlint）
        run: actionlint
      - name: 工作流安全审计（zizmor：未固定 action/权限过大/表达式注入/凭据残留）
        env:
          # 提供 token ⇒ 启用在线审计（已知易受攻击的 action 版本、仿冒提交等）；
          # 无 token 时 zizmor 自动降级为离线审计并如实提示。
          GH_TOKEN: ${{ github.token }}
        run: zizmor --persona=regular .
      - name: 纪律扫描（forbid 覆盖 / 零 unsafe / 零 f64 / 零 SIMD 内建 / 零 fast-math）
        run: bash scripts/discipline_scan.sh .
      - name: 词汇禁令扫描（裁决 61）
        run: bash scripts/vocab_scan.sh .
      # CI 形状锁（承重 job / 关键命令 / 汇总 needs / 权限与成本基线被删即红）。**它此前
      # 只由本地 gate_all.sh 跑**——而它自己的头注写着「也在 CI 的静态层跑」⇒ 一处
      # 「门只在本地跑 = 门是装饰」的实缺口（2026-10-04 核对发现）。这里补上调用；
      # 同步在 ci_shape_lock.sh 里钉一条「本脚本必须在 CI 里被调用」防回退。
      - name: CI 形状锁（门禁只许加强，不许悄悄退役）
        run: bash scripts/ci_shape_lock.sh .
      # 上帝对象门（文件/函数/类型尺寸；棘轮只准减，基线 god-baseline.json）。
      # 脚本零依赖、可移植（scripts/god_gate.py + god.gate.json）⇒ CI 里直接 python3 跑；
      # 先跑门自己的金丝雀（判据坏了门就是摆设）。
      - name: 上帝对象门（尺寸棘轮 + 自检）
        run: |
          python3 scripts/god_gate.py --selftest
          python3 scripts/god_gate.py --root .

  # ==================== 静态层 ②：依赖图 ====================
  static-deps:
    name: 静态 (依赖)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # 本仓自研的依赖红线（纯 Python stdlib，无需装任何工具）：外部依赖 / 构建依赖
      # 只准减不准加，现状与「为什么需要它」见 scripts/deps-baseline.json。
      # 放在装工具之前——本 job 里最便宜的一步先跑。
      - name: 依赖红线（外部依赖 / 构建依赖增量门）
        run: python3 scripts/deps_lock.py
      - name: 安装依赖审计工具
        uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2.87.12
        with:
          tool: cargo-deny@0.20.2,cargo-machete@0.9.2   # 钉版本，理由同 typos（实测日志见 @latest）
      - name: 依赖审计（公告 / 许可白名单 / 禁用 / 来源；配置见 deny.toml）
        run: cargo deny check
      - name: 未使用依赖（cargo-machete）
        run: cargo machete

  # ==================== 静态层 ③：文档与强化 lint ====================
  static-code:
    name: 静态 (文档/强化 lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: rustdoc 警告即错误（含 broken intra-doc links）
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps
      - name: 强化档 clippy（在 -D warnings 之上追加项目纪律 lint）
        run: >-
          cargo clippy --workspace --all-targets --
          -D warnings
          -D clippy::todo
          -D clippy::unimplemented
          -D clippy::dbg_macro
          -D clippy::mem_forget
          -D clippy::undocumented_unsafe_blocks
          -D clippy::let_underscore_must_use

  # ==================== 矩阵①：三编译器 × 全量测试/静态检查 ====================
  matrix:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, label: "MSVC / x86_64", linker: "" }
          - { os: ubuntu-latest, label: "GCC / x86_64", linker: "" }
          - { os: ubuntu-latest, label: "Clang+LLD / x86_64", linker: "-C linker=clang -C link-arg=-fuse-ld=lld" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Clang 工具链（clang 行）
        if: contains(matrix.label, 'Clang')
        run: sudo apt-get update && sudo apt-get install -y clang lld
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        env:
          RUSTFLAGS: ${{ matrix.linker }}
        run: cargo clippy --workspace --all-targets -- -D warnings
      # **为什么不写成裸的 `cargo test --workspace --release`（2026-10-04 实测）**：
      # 全轮 wall-clock 26 分钟里，关键路径就是这一步的**编译**，不是测试——cargo 自报
      # `Finished release in 23m 05s`（MSVC 行；同机口径 GCC 9m 33s / Clang 11m 58s），
      # 而 384 个用例的执行是**秒级**。裸写法会连带构建 34 个 example 与 20 组 doctest
      # ⇒ 约 120 个 release+thin-LTO 链接，全在 4 核 Windows runner 上排队。
      # `--lib --tests` 只留库单测 + 集成测试（判定力所在），砍掉 example/doctest 的链接。
      # 覆盖面去向（**不是删门，是挪门**）：
      #   · doctest → test-debug 档（Linux debug 全量，含 doctest）；
      #   · example **编译** → 本 job 的 Clippy 步（`--all-targets` 覆盖 examples）；
      #   · example **实跑** → determinism 档（m0_gates / determinism / m1_collision_row）。
      # ⚠️ 残留缺口（如实记）：vxl-phys-gpu 的 14 个 example 此后在 CI 里**只做类型检查、
      #    不再做 release 链接**（test-debug 排除了该 crate）。它们是无门的演示件；
      #    哪天要钉住，单列一个 `cargo build --release --examples` 的 job，别退回这里。
      #    另：本档被砍掉的 doctest 实测只有 **3 个用例**（384 = 381 + 3），不是数量级损失。
      - name: Test（工作区；GPU 工作区抖动用例见下一步单独重试——issue #30）
        env:
          RUSTFLAGS: ${{ matrix.linker }}
        run: cargo test --workspace --release --lib --tests -- --skip same_device_rerun_is_bitwise_identical
      # 已知 CI 抖动（issue #30）：MSVC 行的 `sorted_copies_boundary` 偶发**启动期**
      # 0xc0000005（STATUS_ACCESS_VIOLATION，历史"重跑即绿"）。把这两个用例从工作区跑里
      # 分出来、**重试 ≤3 次**：不掩盖任何断言失败（三次都挂 = 红），只吞掉运行器瞬态。
      #
      # **诊断取数（issue #30 第 1 条）**：此前每次失败尝试的输出**全被丢掉** ⇒ 连挂时只剩
      # "exit 0xc0000005" 一行，栈与 wgpu 启动日志都拿不到（这正是该 issue 卡住的原因）。
      # 现在：每次尝试落一个日志文件、失败即打印尾部、由下一步整包上传。
      # ⚠️ `RUST_BACKTRACE` 对 STATUS_ACCESS_VIOLATION **通常无效**（SEH 异常不走 Rust panic
      # 路径）⇒ 真正有用的是 `RUST_LOG` 的 wgpu 启动日志与"第几次尝试挂"的序列。
      - name: "Test: sorted_copies_boundary（重试 ≤3，issue #30）"
        # ⚠️ **必须钉 bash**：Windows 运行器默认 pwsh 会把 `for i in 1 2 3; do` 报
        # `ParserError: Missing opening '(' after keyword 'for'` ⇒ 重试从未执行、
        # 该用例在 MSVC 上成为覆盖盲区（2026-10-01 实测根因，issue #30）。
        shell: bash
        env:
          RUSTFLAGS: ${{ matrix.linker }}
          # 启动期 0xc0000005 在 Rust 运行时可打出 fault 栈（issue #30 的根因抓取用）。
          RUST_BACKTRACE: "1"
          # **wgpu 启动路径日志**（issue #30 第 1 条）：适配器枚举 / 设备请求是"启动期崩溃"
          # 的头号怀疑对象。⚠️ **光设这一行不产生日志**：2026-10-07 之前测试二进制没有初始化
          # logger ⇒ `RUST_LOG` 是死的（issue #30 comment 4 实测"一行都没有"）。现在由
          # `crates/vxl-phys-gpu/tests/common/mod.rs::init_logger` 接到 `log` 门面（`RUST_LOG`
          # 为空则不装 ⇒ 其它 job 零影响）。只开 info 档，别把 CI 日志冲爆。
          RUST_LOG: "wgpu_core=info,wgpu_hal=info,naga=warn"
        run: |
          # ⚠️ **必须开 pipefail**：`bash -e`（Actions 的默认外壳）下管道的退出码是**最后一个
          # 命令**（这里是 `tee`）的 ⇒ `cargo test | tee` 恒为 0 ⇒ 重试会把真失败当成功吞掉。
          set -o pipefail
          LOGS="${RUNNER_TEMP:-/tmp}"
          rm -f "$LOGS"/sorted_copies_attempt_*.log
          for i in 1 2 3; do
            # `-- --nocapture`（2026-10-07 加）：libtest 默认把输出**捕获到内存**，只在测试正常
            # 结束时才吐 ⇒ 挂起/崩溃时现场一行都留不下。开 nocapture 后 `[gpu-diag …]`（wgpu
            # 启动日志）**实时流进 tee 的日志**，随 artifact 上传（issue #30 的取证依赖它）。
            if cargo test --release -p vxl-phys-gpu --test sorted_copies_boundary -- --nocapture \
                2>&1 | tee "$LOGS/sorted_copies_attempt_$i.log"; then
              rm -f "$LOGS/sorted_copies_attempt_$i.log"   # 成功的尝试不留日志（省上传）
              exit 0
            fi
            echo "::warning::sorted_copies_boundary 第 $i 次失败——issue #30 的已知抖动"
            echo "---- 第 $i 次尝试日志尾部（全文随 artifact 上传）----"
            tail -n 40 "$LOGS/sorted_copies_attempt_$i.log" || true
          done
          echo "sorted_copies_boundary 重试 3 次仍失败：不再当抖动，按真失败处理（issue #30）"
          exit 1
      # 失败尝试的诊断包（issue #30）：**只在真有日志时**上传（成功路径上一个文件都不剩）。
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          # ⚠️ **不能用 `matrix.label`**：矩阵 job 里它是 `MSVC / x86_64` 这种带 `/` 的字符串，
          # upload-artifact 会以「名字含非法字符 /」直接失败 ⇒ **把本来绿的 job 判红**
          # （2026-10-03 实测踩到：诊断步骤自己成了红的那一步）。
          # `strategy.job-index` 是矩阵内唯一且字符安全的。
          name: gpu-flake-logs-${{ strategy.job-index }}
          path: ${{ runner.temp }}/sorted_copies_attempt_*.log
          if-no-files-found: ignore
          retention-days: 7

  # ==================== 门⑤：debug 档全测（debug_assert 只在 debug 档编译进来） ====================
  # **为什么有它**（OPEN-PROBLEMS P8 的「教训常驻」）：上面 matrix 的测试一律 `--release`，
  # 而 `debug_assert!` 在 release **被编译掉** ⇒ 引擎不变量在 CI 里从来没被检查过
  # （P8 那个 SAT 断言契约写反就是这么静默过去的）。本 job 用 **debug 档**把这一类断言接进 CI。
  # **口径**：`--exclude vxl-phys-gpu` —— 那些用例走 wgpu，CI 运行器无 GPU（headless），
  # 适配器回退路径与 release 不同、且不属本 job 的目标（issue #30 另案）。本机 MSVC debug 档
  # 同一命令全绿（退出码 0）。
  test-debug:
    name: 测试 (debug 档 · debug_assert)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Test (debug 档；debug_assert 生效)
        run: cargo test --workspace --exclude vxl-phys-gpu

  # ==================== 门①：miri（子集 = vxl-phys-core 单测；UB/别名/泄漏） ====================
  miri:
    name: miri (core 子集)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@0e28dd9a7764e5f83064112bb1f24025a14c313c # nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: miri test -p vxl-phys-core
        env:
          MIRIFLAGS: -Zmiri-strict-provenance
        run: cargo +nightly miri test -p vxl-phys-core --lib

  # ==================== 门②：loom（并发原语模型；见 crates/vxl-phys-core/tests/loom_primitives.rs） ====================
  loom:
    name: loom (并发原语)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: loom 模型测试
        env:
          RUSTFLAGS: --cfg loom
          LOOM_MAX_PREEMPTIONS: 3
        run: cargo test -p vxl-phys-core --test loom_primitives

  # ==================== 门③：TSan（数据竞争；跑并行契约测试） ====================
  tsan:
    name: TSan (并行路径)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@0e28dd9a7764e5f83064112bb1f24025a14c313c # nightly
        with:
          components: rust-src
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: TSan 并行契约测试
        env:
          RUSTFLAGS: -Zsanitizer=thread
          TSAN_OPTIONS: halt_on_error=1
          CARGO_PROFILE_RELEASE_LTO: "false"
        run: |
          cargo +nightly test --release -Zbuild-std \
            --target x86_64-unknown-linux-gnu -p vxl-phys --lib parallel

  # ==================== 门④：ASan（地址/越界/泄漏；core 单测 + 门槛场景短跑） ====================
  asan:
    name: ASan (core + 门槛短跑)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@0e28dd9a7764e5f83064112bb1f24025a14c313c # nightly
        with:
          components: rust-src
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: ASan core 单测
        env:
          RUSTFLAGS: -Zsanitizer=address
          ASAN_OPTIONS: detect_leaks=1
          CARGO_PROFILE_RELEASE_LTO: "false"
        run: cargo +nightly test --release -p vxl-phys-core --lib
      - name: ASan 门槛场景（m0_gates 门槛 + 压力短程）
        env:
          RUSTFLAGS: -Zsanitizer=address
          ASAN_OPTIONS: detect_leaks=1
          CARGO_PROFILE_RELEASE_LTO: "false"
        run: cargo +nightly run --release -p vxl-phys --example m0_gates

  # ==================== 确定性矩阵：三编译器各跑门槛与 10 轮哈希，上传产物 ====================
  determinism:
    name: 确定性 (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, label: "MSVC", linker: "" }
          - { os: ubuntu-latest, label: "GCC", linker: "" }
          - { os: ubuntu-latest, label: "Clang", linker: "-C linker=clang -C link-arg=-fuse-ld=lld" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Clang 工具链（clang 行）
        if: contains(matrix.label, 'Clang')
        run: sudo apt-get update && sudo apt-get install -y clang lld
      - name: m0_gates（门槛 + 压力 + 哈希）
        env:
          RUSTFLAGS: ${{ matrix.linker }}
        run: cargo run --release -p vxl-phys --example m0_gates -- gates-${{ matrix.label }}.json
      - name: determinism（10 轮全等）
        env:
          RUSTFLAGS: ${{ matrix.linker }}
        run: cargo run --release -p vxl-phys --example determinism | tee determinism-${{ matrix.label }}.txt
      # T6 8A 碰撞行：**报告层，不阻断**——计时随 runner 而异（验收以本机数字为准），
      # 故退出码只记录不拦门；JSON 报告进产物（含 env / p50 / p95 / 首帧建树分项）。
      - name: 8A 碰撞行（报告，不阻断）
        continue-on-error: true
        env:
          RUSTFLAGS: ${{ matrix.linker }}
        run: cargo run --release -p vxl-phys --example m1_collision_row -- row-${{ matrix.label }}.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gates-${{ matrix.label }}
          path: |
            gates-${{ matrix.label }}.json
            determinism-${{ matrix.label }}.txt
            row-${{ matrix.label }}.json

  # ==================== 确定性矩阵：aarch64 交叉编译 + QEMU 实跑（私有仓无托管 ARM runner 时的等价覆盖） ====================
  determinism-arm64:
    name: 确定性 (GCC-aarch64/qemu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          targets: aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: 交叉工具链 + QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu qemu-user-static
      - name: aarch64 determinism（10 轮，QEMU 实跑）
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUNNER: qemu-aarch64-static
        run: |
          cargo run --release --target aarch64-unknown-linux-gnu -p vxl-phys --example determinism \
            | tee determinism-GCC-aarch64.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gates-GCC-aarch64
          path: determinism-GCC-aarch64.txt

  # ==================== 汇总：跨编译器/跨架构哈希必须全等（§5 跨平台位级一致） ====================
  hash-compare:
    name: 跨平台哈希比对
    needs: [determinism, determinism-arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { path: arts }
      - name: gate_scene.hash.final 全等断言（x86_64 三编译器）
        run: |
          python3 - <<'PY'
          import json, pathlib, sys
          hashes = {}
          for p in sorted(pathlib.Path("arts").rglob("gates-*.json")):
              d = json.loads(p.read_text(encoding="utf-8"))
              hashes[p.name] = d["gate_scene"]["hash"]["final"]
          base, ok = None, True
          for name, h in hashes.items():
              mark = ""
              if base is None:
                  base = h
              elif h != base:
                  ok, mark = False, "  <-- 不一致"
              print(f"{name}: {h}{mark}")
          if not hashes:
              print("没有产物——determinism 矩阵未产出"); sys.exit(1)
          print("✅ 三编译器哈希全等" if ok else "❌ 三编译器哈希不一致")
          sys.exit(0 if ok else 1)
          PY
      - name: determinism FINAL_HASH 汇总（三编译器 + aarch64 全等式）
        run: |
          set -euo pipefail
          echo "== 各平台 FINAL_HASH =="
          grep -h "FINAL_HASH=" arts/*/determinism-*.txt | tr -d '\r' | sort | uniq -c
          n=$(grep -h "FINAL_HASH=" arts/*/determinism-*.txt | tr -d '\r' | sed 's/.*FINAL_HASH=//' | sort -u | wc -l)
          echo "唯一哈希数 = $n（应为 1；>1 即跨平台不一致）"
          test "$n" -eq 1

  # ==================== 棘轮门禁（自 main 并入：27 个纯 stdlib Python 门 + selftest + probe） ====================
  # 入口 `scripts/local_gate.py` 是 **CI 专用**；本地全量验证仍走 `scripts/gate_all.sh`
  # （行为门 / 金样门 / 计时独占锁）。两者范围不同、不是重复入口——分支此前把自用的
  # local_gate 撤成指路牌，是因为当时它和 gate_all 功能重合；main 这版只跑静态细粒度门。
  # 动作按本仓纪律钉 SHA：setup-python 的 v7 与 v7.0.0 同尖端（合 P9 的注释规则）。
  ratchet:
    name: 棘轮门禁
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: 跑门禁（dag/rayon/unwrap/unsafe/linelen/glob/todo/god/cyc/nest/args + selftest + probe）
        run: python scripts/local_gate.py

  # ==================== 报告层：覆盖率（不阻断；产物供趋势观察） ====================
  coverage:
    name: 覆盖率 (报告)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: 安装 cargo-llvm-cov
        uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2.87.12
        with:
          tool: cargo-llvm-cov@0.9.1     # 钉版本，理由同 typos（@latest 会自己漂）
      - name: 覆盖率（全量测试 + 摘要）
        run: cargo llvm-cov --workspace --release --json --output-path cov.json --summary-only | tee cov-summary.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: coverage
          path: |
            cov.json
            cov-summary.txt

  # ==================== 金样层（T5）：Rapier 对照三场景（报告层，不阻断） ====================
  # 独立包（gold-sample 自带 [workspace]，不进主 workspace）⇒ 需单列 job；首次构建要
  # 拉 rapier 依赖图（网络 + 1-3 分钟）⇒ **只在 PR 与手动触发时跑**（推送不跑，控成本）。
  # 报告层语义：容差表当前有已知缺口（速度/入睡两列，见 docs/M1-PLAN.md T5），故
  # continue-on-error 且不进 gates-summary —— 红=提示，不拦门。
  gold-sample:
    name: 金样 (Rapier 对照)
    if: github.event_name != 'push'
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: gold-sample
      # 配方（必须 substeps=4：默认 1 时 tower25 会塌，见 M1-PLAN T5 注）。
      - name: 三场景对拍（col45 / pile5 / tower25）
        working-directory: gold-sample
        run: |
          for s in col45 pile5 tower25; do
            echo "=== $s ===" | tee gold-$s.txt
            cargo run --release -- "$s" 600 16 0.01 4 3.0 30 4 2>&1 | tee -a gold-$s.txt
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: gold-sample
          path: |
            gold-sample/gold-*.txt

  # ==================== 规模档（10 万 + 10 万）：**此前只在本地跑**，2026-10-06 搬进 CI ====================
  # 为什么必须在 CI：`gate_scale.sh` 判的是**确定性量**（NaN / 深穿透 / 峰值流形 / 峰值接触点 /
  # 峰值候选 / warm 槽 / 活跃 tick / 末态 awake / 翻转峰）—— 它们只由场景与码决定、**跨机可比**，
  # 是"M1-EXIT §2.3 登记'规模档没有自动门'这条出口债"的唯一自动化落点。计时量在脚本里本就是
  # **软门**（>2× 才红，>1.5× 只黄）⇒ 上 CI 不会变成 flaky 计时门。
  # ⚠️ 别把这一步改成"只报不判"：`F_CAND` / `F_MF` / `F_PTS` 那几项是**精确断言**，
  # 它们正是防"改一行让候选翻倍"的那道门（2026-10-06 的宽相各轴独立 fat 盒换代就是被它抓到的）。
  scale:
    name: 规模档 (10 万+10 万)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # 日志落工作区（脚本默认那条 `C:/…` 是给 Windows 本地留的；CI 上显式给路径，别凭空造 `C:` 目录）。
      # ⚠️ `SCALE_TIME_REPORT=1`（2026-10-06 首次上场实测后加）：runner 只有 4 vCPU、冻结值取自
      #    本机 8 线程 ⇒ 计时实测 **2.53×** 冻结值 —— 按 `SPEC` §5「性能门只在参考硬件判定」，
      #    这台机器**不该判计时**（只报）；**确定性量照旧逐项精确判**（首次上场时它们**全部命中**，
      #    顺带证明了 10 万档场景**跨平台逐位可复现**）。
      - name: 规模档门（确定性量精确判；计时在 CI 只报不判）
        run: SCALE_LOG=scale-gate.log SCALE_TIME_REPORT=1 bash scripts/gate_scale.sh
      # `m1_islands`：**只判机器无关的那一条** —— 串行/并行末态哈希逐位一致。
      # ⚠️ 示例**自己**会对"解算扩展 ≥3×"打 verdict 并以非零退出（首次上场实测：4 vCPU runner 上
      #    2.08×）。但按 `SPEC` §5 那条判据归**参考硬件**（见 `OPEN-PROBLEMS.md` T4 的更正：
      #    本机 9 跑 2.75–3.75× 单次不可判）⇒ 这里**不看它的退出码**（`gate_all.sh` 里那一步
      #    也是 `want=report`，同款口径），只看输出里那条机器无关的哈希一致；**缺了那行照样红**
      #    （崩了/没跑到自然就没有那行）。
      - name: m1_islands（只判串并行哈希一致；扩展比只报）
        run: |
          cargo run --release -q -p vxl-phys --example m1_islands > islands.txt 2>&1 || true
          tail -4 islands.txt
          grep -q "逐位一致" islands.txt || { echo "::error::m1_islands 未产出「串行/并行末态哈希逐位一致」（崩了或没跑到）"; exit 1; }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: scale-gate
          path: |
            scale-gate.log
            islands.txt

  # ==================== 汇总门：任一前置门未成功 → 红（Free 私有仓无必需检查，单状态即分支门） ====================
  gates-summary:
    name: 汇总（提交门）
    needs:
      - static-text
      - static-deps
      - static-code
      - matrix
      - test-debug
      - miri
      - loom
      - tsan
      - asan
      - determinism
      - determinism-arm64
      - hash-compare
      - ratchet
      - scale
    if: always()
    runs-on: ubuntu-latest
    steps:
      # `if: always()` 是承重的：缺了它，前置门失败会让本 job 被 SKIP，
      # 而 GitHub 把 skipped 的必需检查视作通过——门就漏了。
      - name: 任一前置门未成功则失败
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: |
          echo "::error::前置门结果：${{ join(needs.*.result, ', ') }}"
          exit 1
      - name: 全部前置门成功
        run: echo "全部前置门成功（${{ join(needs.*.result, ', ') }}）"
