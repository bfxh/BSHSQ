# Dependabot：依赖与 action 的自动升级提案（仓沪治理）。
#
# 成本纪律：私有仓 Actions 按分钟计费，dependabot 每个 PR 都会触发一轮 CI——
# 故采取「低频 + 分组 + 限并发」三约束：
#   - 分组：同一生态的补丁/次要更新合成一个 PR（一轮 CI 覆盖多条升级）；
#   - 限并发：open-pull-requests-limit 压到 2，避免 PR 堆积同时烧管线；
#   - 频率：cargo 每周、actions 每月（actions 变更频率低且安全影响直接）。
#
# 引擎依赖面本身极小（仅 xxhash-rust）——本文件的主要价值在 github-actions
# 一侧：action 版本升级会带来安全修复（与 zizmor 审计互补）。

version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    # cooldown：新发布版本先冷却 7 天再提案（供应链攻击的暴露窗口多在发布后
    # 数小时到数天内被发现；zizmor 审计项 dependabot-cooldown）。
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    groups:
      cargo-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "deps"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    groups:
      actions-all:
        patterns: ["*"]
    commit-message:
      prefix: "ci"

    # 同一 action 在 ci.yml 里用两次、ref 不同（stable 一个 sha、nightly 一个 sha）。
    # dependabot 把两个 ref 当成一条依赖，会提议把 nightly 那行也改成 stable 的 sha
    # —— main 上撞过（PR #12：注释仍写 nightly、实际拿到 stable ⇒ miri / TSan 拿不到
    # nightly 工具链直接红）。两条 ref 需人工按用途分别定，不交给自动 bump。
    ignore:
      - dependency-name: "dtolnay/rust-toolchain"
        update-types: ["version-update:semver-patch",
                       "version-update:semver-minor",
                       "version-update:semver-major"]
