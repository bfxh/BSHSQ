        note: >
          **这一项是本仓唯一不要求逐位的金样**，并且是被 CI 逼出来的结论：车是**接触驱动的混沌系统**，
          `180` tick 足够把 1 ulp 放大到末态位模式不同。去掉全部三角函数后差距仍有
          **`1.2e-4`**（实测，Windows vs Linux CI）⇒ 取 `1e-3` 留 8 倍余量。详见 `docs/PHYSICS-INVARIANTS.md` §2.4。
      - id: ci_verification_path
        note: Linux CI（金样 job）+ 本地 `bash scripts/gate_gold.sh` 双通过（2026-10-17）。
    required_evidence:
      - implementation_path
      - ci_verification_path
    decision_id: null
    owner: maintainer
    notes: >
