          散射增益与**闭式口径**对拍且对系数**线性**、**Lambertian**（同距离下绕离法向 60° 恰好弱一半）、
          腿被挡则无路径、逐带系数 ⇒ 带比等于系数比 + 预算 + 逐字确定性 + `state_hash` 不变。
          ⚠️ 仍**不做** Fresnel 积分与楔角 UTD 系数（`D(θ) = (1+cosθ)/2` 与 Lambertian 都是工程近似）。
      - id: a5_landed
        note: >-
          **A5 已落地（2026-10-11）**：动态源/听者本来就成立（声源逐 tick 取 `World::impacts()`、
          听者位置每次调用由调用方给）；这一期补的是**预算与实时档**：
          ① **产出按优先级（能量）截断**到 `max_paths`（先收本 tick 的候选，再 `sort_by` 稳定排序取
          最响的 K 条 —— 平局仍按产出顺序，逐位可复现），丢弃数如实计入 `dropped_budget`；
          候选侧的四个上界（`max_reflections` / `max_portals` / `max_edges` / `max_scatters`）仍是**工作量**上界。
          ② `AcousticTier { Offline, Realtime, Minimal }` = **确定性的工作量上界预设**（`config()` 给旋钮组合；
          **不是墙钟预算** —— 宿主想帧率自适应请自己选档）。
          判据 `tests/a5_realtime.rs` 4 条：留下的必须是**最响的 K 条**且丢弃数 = 候选数 − K、
          档越省候选越少且 `Minimal` 不算反射（顶满时上报）、移动听者下**时延受几何界、增益受
          Lipschitz 界（`2/d³·Δd`）、路径数不抖**、同扫掠两跑逐字一致 + `state_hash` 不变。
          CLI 加 `--realtime`（同一房间：全量 1421 行 → 实时 1064 行）。**GPU 档**仍未做。
      - id: a4_auto_edges
        note: >-
          **自动认边已落地（2026-10-11）**：`AcousticGeometry::detect_edges(&EdgeDetect)` —— 从三角
          网格里认出**边界棱**（只被一个三角用 ⇒ 刀刃）与**凸棱**（二面角 ≥ `min_wedge_deg`，且相邻
          面的第三顶点在第一个面平面的外侧）；跳过共面/微折、**凹**棱与相邻面多于两个的非流形棱。
          ⚠️ 前提是**三角绕序朝外一致**（凸凹判据依赖它）；顺序按顶点对字典序 ⇒ 逐位可复现。
          判据 `tests/a4_auto_edges.rs` 5 条：盒子恰好 12 条凸棱（6 条面对角线不算，测试自查绕序朝外）、
          平板留 4 条边框而不留中间对角线、**凹接缝不算**、浅折由 `min_wedge_deg` 卡（阈值两侧各取
          一档、自校准折角）、认出来的棱直接驱动 A4 绕射且最短折线与**暴力扫棱**一致。
          ⚠️ **已知边界**：自动认边会把"墙立在地板上"这类**顶点不共享**的接缝也认成边界棱，而那种楔
          在物理上是**凹**楔（UTD 刀刃公式不适用）⇒ 自动认边适合**独立薄片/道具**（真有刀刃），
          房间级接缝更该由作者显式标（文档 §8 把自动认边列为兜底正是这个理由）。
      - id: a3_refraction_landed
        note: >-
          **折射（Snell 折转）已落地（2026-10-11）**：`AcousticMedium::refracted(src, dst, iters)`
          （默认 `None` = 不建模折射；折线由**介质自己**给 —— 只有它知道层界，本层只做逐段遮挡检查）
          + 新路径种类 `Refracted` / 统计 `refracted` / `AcousticConfig::refraction_iters`（定次数）。
          `LayeredMedium` 的实现用**水平慢度守恒** `p = sinθ/c`：对 `p` 做**定次数二分**找到把声线
          正好送到听者的那个值（`run(p)` 单调 ⇒ 二分正确），折点落在层界上；需要的 `|p|` 超过
          `1/c_max` 就返回 `None`（这就是模型里的**临界角**约束）；**均匀则返回 `None`**（直线就是解，
          交给直达那条，避免重复计能）。判据 `tests/a3_refraction.rs` 5 条：① 折点上的 **Snell 定律**
          （`sinθ/c` 两侧相等，相对 1e-3）+ 折线旅行时等于**暴力扫界面点**的最小值（相对 1e-4）+
          比直线积分更快（**Fermat**）；② 路径级：时延/逐带衰减/到达方向与介质给的一致；
          ③ 均匀介质不折；④ 折线任一段被挡 ⇒ 不产出（去掉挡板就有）；⑤ 确定性 + `state_hash` 不变。
          ⚠️ 边界：只做**分层（水平层界）**介质；曲面/一般体积场要折线就自己实现 `refracted`。
      - id: a5_gpu_base
        note: >-
          **GPU 档的"基础件"已落地（2026-10-12）**：几何与材质表本来就是**平铺切片**（`&[Vec3]` /
          `&[[u32; 3]]` / `&[[f32; BANDS]]`）⇒ 上传给计算着色器不需要再打包；在此之上加
          `AcousticsExt::acoustic_cues_batch`（对**一批听者**归约）。契约三条：① **逐位等价** ——
          批里每个听者的结果与单独调 `acoustic_cues` 完全相同；② **输出分段** —— 每个听者的路径
          连续成段、段长 = `AcousticStats::paths()`；③ **逐听者预算** —— `max_paths` 不跨听者共享
          （否则后面的听者会被前面的饿死）。为此把统计口径改成**产出**（截断后重算逐类计数；
          候选侧丢弃仍记 `dropped_budget`），`Listener` 也补了 `Copy`。
          判据 `tests/a5_gpu_batch.rs` 4 条（逐位等价 / 逐听者预算（1 条额度 × 3 听者 ⇒ 恰好 3 条，
          共享预算时后两个会变 0）/ 空批与单元素批 / 确定性 + `state_hash` 不变）。
          ⚠️ **设备内核仍未做**（属 `vxl-phys-gpu`：那里才有 wgpu 会话；既有口径
          `cargo test --workspace --exclude vxl-phys-gpu` ⇒ headless CI 不跑 GPU 用例）。
      - id: a5_gpu_direct_kernel
        note: >-
          **GPU 档的「直达核」（M1）已落地（2026-10-12）**：`vxl-phys-gpu` 的
          `src/acoustic.rs` + `src/acoustic.wgsl` —— 一批 `(声源, 听者)` 对，每对一个工作项
          （`@workgroup_size(64)`），核内走**真正的射线-三角**（Möller–Trumbore，端点共面不计）
          + `dist/speed` 与 `1/dist²`；与 CPU 端 `vxl-phys-acoustics` 的直达同口径。
          复用既有的 `pipeline::gpu_setup`（`mk_layout`/`mk_pipe`/`dispatch`/`ent`/`f32_bytes`）与
          `mapped::mapped_view` 回读 ⇒ **不引新依赖、不用 unsafe**。
          探针 `crates/vxl-phys-gpu/tests/acoustic_direct_probe.rs`：场景是**轴对齐屏障**，参照值用
          纯算术写（线段与 `z=1` 的交点落不落在矩形内），与卡上跑的**不是同一份实现** ⇒ 不是自证。
          判据 = **拓扑（遮挡分类）逐位 + 浮点（时延/增益）相对 1e-4**；无适配器则打印 `[SKIP]`。
          实测（本机）：`NVIDIA GeForce RTX 4060 Ti | Vulkan | DiscreteGpu` 上 6 对全对。
          ⚠️ **CI 不覆盖**（既有口径 `cargo test --workspace --exclude vxl-phys-gpu`：headless 运行器
          无 GPU）⇒ 这条路只能在本机或 GPU 探针 job 上验；**介质积分仍未上卡**。
      - id: a5_gpu_reflect_kernel
        note: >-
          **GPU 档的「一次镜面反射」（M2）已落地（2026-10-12）**：`acoustic.wgsl` 加 `reflect` 入口 ——
          逐三角跑**镜像源法**（镜像听者 + 平面求交 + 重心内点 + 两段遮挡），逐对取**最强那条**
          （平局按三角序号取小 ⇒ 确定），输出 `(hit, delay, gain, tri)`；吸收表按三角逐个读
          （`(1-a)/(d₁+d₂)²`）。宿主侧把两个入口的缓冲/回读抽成共用件，并新增
          `acoustic::reflected_on_adapter`。
          探针 `crates/vxl-phys-gpu/tests/acoustic_reflect_probe.rs`：地板 `y = 0` 场景，参照值用
          **镜像展开**手算（`L = |src' − dst|` ⇒ 时延 `L/c`、增益 `1/L²`），与卡上的逐三角实现
          **不是同一份**；第二段再插一块**全吸收**挡板（它自己不成反射面）⇒ 折线被遮就**不得**
          报出反射。实测（本机 RTX 4060 Ti | Vulkan）：两段顺序跑 2.6 s 全过。
          ⚠️ **两条测试不要并行**：并行会各建一个 wgpu 设备，实测互相卡住 ⇒ 探针里合成**一条**测试
          （文件头注写明了这条坑）。CI 同样不覆盖（`--exclude vxl-phys-gpu`）。
      - id: a5_gpu_diffract_kernel
        note: >-
          **GPU 档的「绕射」（M3）已落地（2026-10-12）**：`acoustic.wgsl` 加 `diffract` 入口 ——
          逐棱取 **Fermat 点**（定次数 **48** 的二分，与 CPU 的 `FERMAT_ITERS` 同值 ⇒ 同样的定次数、
          无早退、逐位可复现）、**只在阴影里**产出（直达通视就整对跳过，不与直达重复计能）、逐对取
          **最强那条**（平局按棱序号取小 ⇒ 确定），输出 `(hit, delay, gain, edge)`；口径
          `coeff·(1+cosθ)/2/(d₁·d₂)`（**单频带**：频带表与介质衰减还没上卡）。宿主侧把输入收口成
          `acoustic::SceneIn`（`diffract` 这条本来要 7 个形参、撞 args-gate 的软阈值 ⇒ 打成结构体），
          棱表与逐棱系数各一张缓冲（空表补**非零长**的哑缓冲）。
          探针 `crates/vxl-phys-gpu/tests/acoustic_diffract_probe.rs`：一把刀口（屏障的顶棱）——
          参照值是**手算的对称驻点**（`x = 0` 处两项余弦等值反向 ⇒ 驻点在棱的中点）与沿棱
          **暴力扫 20001 点**的最小折线长，与卡上那 48 次二分**不是同一份实现**；六段顺序跑
          （5 趟）：
          闭式对拍 / 同输入两跑逐位一致 / 暴力扫最小值 / **两条棱取最强**（弱的那条排在前面 ⇒
          证明扫的是全表而不是第一条）/ 第二腿被挡不产出 + 阴影外不产出。实测（本机
          RTX 4060 Ti | Vulkan）：4.8 s 全过。⚠️ CI 同样不覆盖（`--exclude vxl-phys-gpu`）。
      - id: a6_audio_render
        note: >-
          **A6「离线音频渲染」已落地（2026-10-12）**：`crates/vxl-phys-acoustics/src/audio.rs` ——
          cue 流（`SoundPath`）→ **能听的波形**（调研文档 §8 第 3 条的落地：音效师拿它**对表**、
          集成方拿它**回归**）。两条口径：**幅度 = `sqrt(能量)`**（`bands` 是能量增益）、**不乘**
          `SoundPath::gain`（它就是中频带，乘了等于中频带计能两次）。逐带分频是两级一阶低通
          （`低 + 中 + 高 ≡ 原信号` ⇒ 完美重构，f32 下只差舍入）；按 `delay` **量化到整数采样**直叠；
          WAV 只做 PCM16 写 + PCM16/float32 读（多声道降混）——**零新依赖**。
          判据 `tests/a6_audio.rs` 6 条：① 尖峰 = 时延（±1 采样）、尖峰高 = `sqrt(能量)`；
          ② 叠法与测试侧手算的参照逐采样一致（≤1e-6）；③ 分带**行为**单调（60 Hz 走低带 ≥10×、
          2 kHz 走中带、12 kHz 走高带 ≥10×）；④ 拍手的首达落在 `delay` 上（±4 采样）且更远更弱；
          ⑤ WAV 往返（量化 ≤2e-5）+ 立体声降混 + 非 WAV 报错（不猜）；⑥ 真实场景端到端
          （体素地面砸出的冲击 ⇒ 绕射/反射路径渲成**有声且有限**的波形、两跑**逐位一致**（含 WAV
          字节）、渲染前后 `state_hash` 不变）。
          ⚠️ 边界：**单声道**（HRTF/双耳不做）、时延量化到采样（48 kHz ≈ 21 µs）、**没有混响尾巴**
          （只渲显式路径 ⇒ 多次反射仍在路线图外）。
          CLI：`vxl-phys audio <voxel> [ticks] <出.wav> [干信号.wav]`（默认激励 = 确定性拍手；
          写盘前按峰值归一，比例打印）。实测（本机 2026-10-12）：单声撞击的 IR 里 5 条路径
          （透射 9.431 / 门洞 9.934 / 绕射 11.885 / 反射 32.576 / 漫反射 34.023 ms）与渲染出的尖峰
          逐条对上、**最大偏差 0.00 dB**；6 s 场景（214 声事件 / 1421 条路径）峰值 1.57 ⇒ 归一 ×0.637 落盘。
      - id: a5_gpu_scatter_kernel
        note: >-
          **GPU 档的「散射」（M4）已落地（2026-10-12）**：`acoustic.wgsl` 加 `scatter` 入口 —— 逐三角
          取**面中心**当二级声源（Lambertian 工程口径）：法向朝声源那侧、要求声源/听者**同侧**且两个
          余弦 > 0、两条腿都不被挡，逐对取**最强那个面**（平局按三角序号取小 ⇒ 确定），输出
          `(hit, delay, gain, tri)`；口径 `s·cos_in·cos_out·A/(d₁²·d₂²)`（`A = |cross|/2`，
          **单频带**系数）。宿主侧 `SceneIn` 加 `scatter` 表（空表 = 全 0 = 纯镜面），新增
          `ScatterOut` / `scattered_on_adapter`。
          ⚠️ 顺手补了一个**越界读隐患**：逐三角表（吸收 / 散射）空表时按**三角数**补零、非空但给短了
          直接报错 —— 核内是 `absorb[t]` / `scatter_coef[t]` 直接索引，只补 1 个元素的话"空表 +
          多个三角"就是越界读（反射那条以前也踩在这个坑边上）。
          探针 `crates/vxl-phys-gpu/tests/acoustic_scatter_probe.rs`：一块 `y = 0` 的直角三角地板
          （面积 2、重心 `(2/3, 0, 2/3)`），声源悬在重心正上方 1 m、听者距重心 2 m 按角度摆 ⇒
          **手算就是 `gain = 0.5·cosθ`**：判据全用手写常数（`0.5` / `0.4330127` / `0.25` /
          `0.12940952`），其中"**绕离法向 60° 恰好弱一半**"单独钉一次；再补四条否证/边界：听者不在
          同侧 ⇒ 不产出；到听者那条腿被挡 ⇒ 不产出；**取最强那个面**（弱的小面排前面、放大 2 倍的
          面排第二 ⇒ 必须选第二条；再把那个强面的系数设 0 ⇒ 落回小面）；同输入两跑**逐位一致** +
          空散射表 ⇒ 一对也不产出。实测（本机 RTX 4060 Ti | Vulkan）：五段 7.3 s 全过；与
          直达/反射/绕射三条探针一起复跑也全过。⚠️ CI 同样不覆盖（`--exclude vxl-phys-gpu`）。
      - id: cli_wired
        note: >-
          **工具链已接（2026-10-11）**：`vxl-phys-cli acoustic <voxel> [ticks]` 打声学路径流（JSONL，
          与感官域的 `cue` 同款 ⇒ 直接进 `record / replay` 的跨机器对拍）；声学几何是**声明的"房间"**
          （地板 + `z = 1.5` 的墙 + 门洞），与碰撞体无关；听者站墙外侧 ⇒ 门洞路径 vs 墙透射约 **40×**。
          判据 `crates/vxl-phys-cli/tests/cli.rs`。
    required_evidence:
      - implementation_path
      - tests
    decision_id: null
    owner: maintainer
    notes: >-
      落点 = 新 crate `vxl-phys-acoustics`（门面之上、纯只读，API 走扩展 trait）。
      A1（静态直达 + 一次反射 + 遮挡）与 A2（portal 穿孔 + 透射泄漏）已落 —— 低频波动效应
