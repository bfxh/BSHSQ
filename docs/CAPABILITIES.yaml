          `Cue` 与 `SlideCue` ⇒ **S1/S2 两条流共用同一张表同一套判据**）、`map_banks(&SoundTable,
          &[T])`。挂载方式是**追加不破坏**：`write_jsonl_banked` / `slide_jsonl_banked` 在行尾追加
          `"bank"` 字段，原 `write_jsonl` / `slide_jsonl` 转调并传 `None` ⇒ 不给表时输出与 S1/S2
          **逐字节相同**（两条基线不受影响，已实测）。**核心判据：缺项显式拒绝**——表里查不到的
          材质槽 ⇒ 报错并点名该槽 + **退出码 2**，**绝不回落默认音**；`map_banks` 全有或全无
          （不在缺项时部分映射）。`Material` 一个字段都没加（它是棘轮管的类型），映射全在外部表。
          判据两侧：库侧 `tests/table_contracts.rs`（3 条：报错带行号 / 缺项拒绝不默认 / 两条流过
          同一张表逐行等价），工具链侧 `scripts/gate_sense.sh` 的 `table` 模式。
      - id: s3_measurement
        note: >-
          S3 例场（`bank` 模式：体素地板 + 64 盒雨**逐体挂 3 种材质**，槽 1/2/3 / 300 tick /
          预算 16）：冲击流 957 条、槽分布 349/309/299 ⇒ 三种槽同时出现在一条流里。**为什么单开
          这个场景**：S1/S2 的盒雨没显式挂材质（`mat` 全是默认槽 0），拿它演示"表按材质分派音色组
          id"**判不出对错**——一行表查谁都对。门在**多槽**流上用**本门自造**的参考表
          （`slot -> 1000+slot`）逐行对拍 `bank == 1000 + mat`（拿仓库示例表判是自指的，"永远返回
          第一条"那种实现照样能对上自己的表），并要求**至少两个槽**真的出现、槽 ⊆ {1,2,3}；
          再把流里第一个槽从参考表里删掉造"半张表"，要求退出码 2 + **点名**该槽 + **一行 cue 都
          不产出**。仓库示例表 `assets/sound_table.txt` 另配 `impact`（槽 0）判一遍，防示例资产腐烂。
      - id: s4_landed
        note: >-
          **S4 已落地（2026-10-16）**：`crates/vxl-phys-sense/src/haptic.rs`——`HapticConfig`
          （`update_hz` / `attack` / `release` / `impact_scale` / `slide_scale` / `slide_full_speed`）、
          `HapticFrame{tick,frame,intensity}`、`HapticStats{frames,clamped,silent,peak}`、
          `HapticDriver`（`step(tick, &[Cue], &[SlideCue], &mut Vec<HapticFrame>) -> HapticStats`）。
          **与 S1–S3 的结构差别**：前几片是**无状态归约**（每 tick 只看本 tick 的事件），S4 是
          **带状态整形**——唯一 state 是包络 `env`；`target ≥ env` 走 `(env+attack).min(target)`、
          `target < env` 走 `×release` 且 `.max(target)` ⇒ `env ∈ [0,1]` 是**不变量**（"上钳"是递推
          本身的性质，不是事后 `clamp`）。`HapticDriver` **连 `&World` 都不收**（只吃
          `&[Cue]` / `&[SlideCue]`）⇒ 零干扰是**类型级**的，不靠约定。一路电平合成两个源：
          `drive = max(冲击 gain×impact_scale, 滑移 gain×slide_scale)`——**取 max 不求和** ⇒
          与 cue 顺序无关、与预算无关。更新率口径：每 tick 恰好
          `frames_per_tick = round(update_hz × dt)` 帧，`frame = tick × fpt + k` 是 `tick` 的**纯
          函数** ⇒ **延迟 0 帧**（本 tick 的 cue 在本 tick 首帧生效）。判据两侧：库侧
          `tests/haptic_contracts.rs`（4 条：上钳边界闭在 1.0 / 包络单调且不超调 / 更新率与延迟
          口径 / 零干扰且帧流与 cue 顺序无关），工具链侧 `scripts/gate_sense.sh` 的 `haptic` 模式
          （两跑逐字节 + **上钳边界**与**释放段单调**两条结构性质 + 更新率口径 + 基线
          `bench/baselines/sense_dump_haptic_300x64.json` 对拍）。
      - id: s4_measurement
        note: >-
          S4 基线（`haptic` 模式：场景 A 体素盒雨 + 场景 B 平滑地板滑移，**并行合成同一路**输出 /
          300 tick / 预算 16）：`tick_dt = 0.016666668`、`update_hz = 1000`、`frames_per_tick = 17`、
          帧 5100（= 300×17）、冲击 cue 957、滑移 cue 608（与 S1/S2 各自基线**逐数一致**）、
          `clamped = 11` 帧（场景最大 drive ≈ 1.044 ⇒ 上钳真的发生过、边距很薄）、`silent = 2973`、
          `peak = 1`、`last_cue_tick = 86` ⇒ 纯释放段 3621 帧逐帧非增、末帧**恰好** `0.0`。
      - id: s4_defect_found_by_criterion
        note: >-
          **判据首次运行就抓到设计缺陷（值得留档）**：释放分支最初写 `(env × release).max(target)`，
          包络**永远到不了** `0.0`——f32 最小正数 `4e-45` 乘 `0.86` 按最近舍入又回到 `4e-45`
          （**次正规数不动点**），"释放干净"退化成常驻微振（器件长期嗡嗡）。修法：下降分支加**形状
          约束** `decayed < env` 不成立就**落到 `target`**。**门的形状也随之被修正**：帧流固定 6 位
          小数 ⇒ `4e-45` 打印出来就是 `0.000000`，"末帧 == 0.0"这条**只看流看不见残值**（注入实验
          证实），故门必须再配全精度判据 `silent > 0`（Rust 侧逐帧数"包络真的是 `0.0` 的帧数"）。
          三条判据各做过一次注入实验（`drive × 0.9` 使上钳失效 / 次正规不动点 / 释放段再抬电平），
          **全部当场转红**且为**结构性命中**（不依赖基线），注入后逐次还原、恢复后四模式全绿。
    required_evidence:
      - implementation_path
      - tests
    decision_id: null
    owner: maintainer
    notes: >-
      本仓第一条"输出侧"域。它同时是 `ROUTE.md` §7 那条"域侧 API 走扩展 trait"的**第一次实考**：
      若 S1 能在**不碰 `World` 任何既有方法**的前提下落地，那条设计判据就被证实可用。
      S1 → S2 → S3 → S4 四次落地都满足"`World` 一个方法都没加"（`SenseExt` 扩展 trait + 外部表 +
      S4 的 `HapticDriver` 连 `&World` 都不收），该判据已被重复证实；S3 还加了第二条：**新增映射**
      走外部资产表而不是往 `Material`（棘轮管的类型）塞字段。

  - id: PHY-SCOPE-ACOUSTIC-PROPAGATION
    title: 声学传播（射线追踪音频：反射/衍射/遮挡 + 孔隙传声 + 介质体积）
    scope: included
    implementation: partial
    implementation_path: crates/vxl-phys-acoustics/src/lib.rs
    evidence:
      - id: user_scope
        note: >-
          用户 2026-10-11 点名："射线追踪音频……可以听见房间外的声音，可以按体积密度等等，
          可以不受碰撞体的影响直接利用建模的缝隙然后听见声音——在有限的条件下还原真实声音。"
          ⇒ 登记为 included。
      - id: design_doc
        note: >-
          调研 + 落地方案见 `docs/SURVEY-ACOUSTIC-RAYTRACING.md`（技术全景 / 系统与论文清单 /
          本仓差距 / 三条设计原则 / A1–A5 分期与判据 / 复用点与禁区 / 边界 / 三处待裁）。
      - id: design_principles
        note: >-
          ① **声学几何 ≠ 碰撞几何**（声学层吃建模面，不读 `BodySet` 的碰撞形状）；
          ② **缝隙/开口 = 显式 portal 拓扑**（开口当二级声源；无 portal 的墙按材质透射系数泄漏）；
          ③ **介质 = 体积参数场**（密度/声速/吸收沿途衰减，"按体积密度"落在这里）。
      - id: contracts
        note: >-
          三条契约与感官域同款（CI 可判）：零干扰（开/关声学层 `state_hash` 逐位不变）、
          确定性（逐字相同的声学 cue 序列；复用 `record/replay` 跨机器对拍）、
          预算（每 tick 声线数/反弹/portal 穿越有上界，超了按优先级截断并上报）。
      - id: reuse
        note: >-
          可复用 `TriMesh`/`VoxelVolume` 的几何与 `MeshGrid` 桶、`vxl-phys-broad` 的 BVH 射线查询、
          `vxl-phys-sense` 的 cue 流与工具链模板、`vxl-phys-field` 的场注册表。
          禁区：不往 `World` 加方法、不往 `Material` 塞声学字段（属性放外部表）、不在 `step()` 里做重活。
      - id: a1_landed
        note: >-
          **A1 已落地（2026-10-11）**：新 crate `vxl-phys-acoustics` 的 `AcousticsExt`
          （`impl AcousticsExt for World`，只持 `&self`）归约"**直达 + 一次镜面反射（镜像源法）+
          遮挡**"——声源取 `World::impacts()`（与破坏/感官同源、事件驱动），几何由调用方以**建模面**
          切片交进来（**不读** `BodySet` 的碰撞形状）。判据 `crates/vxl-phys-acoustics/tests/a1_paths.rs`
          4 条：闭式对拍（增益 `1/d²`、时延 `d/c`、镜像距离）、墙挡直达（`blocked>0` 且 `direct==0`）、
          路径预算顶格上报、调用前后 `state_hash` 逐位不变。
      - id: a2_landed
        note: >-
          **A2 已落地（2026-10-11）**：**portal 穿孔传声** —— 开口由作者以 `Portal { quad, open }`
          显式声明（**不看碰撞体**、也不要求几何里真挖了洞），传播时当**二级声源**：`声源 → 开口中心
          → 听者` 两段都不被挡就产出一条 `Portal` 路径，增益 = **开启比例** / (d1+d2)²；
          **无 portal 的墙按透射系数泄漏**（逐面 `AcousticGeometry::transmission` 外部表，`0` = 实墙）。
          判据 `tests/a2_portals.rs` 4 条：关门 ⇒ 只剩透射泄漏 / 开门 ⇒ 恢复（≥20×）、缝宽 → 衰减
          **严格单调且线性**、`transmission = 0` 的墙零泄漏、路径与开口**双预算**上报 + 逐字确定性。
      - id: a3_landed
        note: >-
          **A3 已落地（2026-10-11）**：**介质体积场**（`src/medium.rs`）—— 只读的 `AcousticMedium`
          （`at(p) -> Medium { 声速, 吸收 }`，本层**不读** `World` 的介质通道：那个 `MediumField` 是
          动态双向耦合、给的是密度/动量，声学用的由调用方**适配**进来）；分层介质
          `LayeredMedium` 给**解析积分**（按层边界切段累加 `len/c` 与 `exp(-Σα·len)`），其它场退回
          **固定步长中点法**（步长 = `AcousticConfig::medium_step`，无随机/无自适应）。判据
          `tests/a3_medium.rs` 4 条：均匀介质与 `L/c`、`exp(-αL)/L²` 对拍、穿层与 `d₁/c₁ + d₂/c₂`
          对拍、只给采样的场误差 ≤ `step·span` 且步长 10× 更小则更贴解析值、确定性 + `state_hash`
          逐位不变。
      - id: bands_landed
        note: >-
          **频带已落地（2026-10-11）**：`BANDS = 3`（低/中/高，**不给绝对频率** —— Hz 分组由宿主定）
          —— 逐面吸声 `absorption[i][b]`、逐面透射 `transmission[i][b]`、介质 `Medium::attenuation[b]`
          全部逐带，输出 `SoundPath::bands`（`gain` 是**中频带**：三带同参时与旧标量口径**逐位相同**）。
          判据 `tests/a3_bands.rs` 5 条：退化档三带逐位相同且回到 `1/d²`、介质逐带与 `exp(-α_b·L)/d²`
          对拍且**高频更闷**、透射逐带与 `τ_b/d²` 对拍且高频更难透、反射**带比** = `(1-a_b)` 比、
          确定性 + `state_hash` 不变。⚠️ **输出格式换代一次**：`jsonl` 每行多 `"bands":[…]`
          （`record/replay` 的旧基线会 FAIL 并指到第一个观测点 —— 这是设计内的 loud failure）。
      - id: acoustic_not_done
        note: >-
          **仍未做（如实登记）**：UTD 的**一般楔角系数**已由 A9b 补上（2026-10-16，见
          `a9b_wedge_landed`；**刀刃 Fresnel 积分**由 A9a 补上，见 `a9a_fresnel_utd_landed`），
          漫反射口径仍是工程近似、
          **GPU 档六条腿全落（M1–M6：直达 / 一次反射 / 绕射 / 散射 / 介质积分 / 二阶反射）**（见
           `a5_gpu_direct_kernel` / `a5_gpu_reflect_kernel` / `a5_gpu_diffract_kernel` /
           `a5_gpu_scatter_kernel` / `a5_gpu_medium_kernel` / `a5_gpu_reflect2_kernel`；本层已落批处理
           入口与逐位等价契约，见 `a5_gpu_base`），且 **M3 的 A9a 刀刃 Fresnel + A9b 一般楔角修正也已上卡**
           （2026-10-16，见 `a9b_wedge_kernel`；`band_hz ≤ 0` 时退回旧口径、逐位不变）。
           卡上仍没有的是**更高阶的多次反射**与**统计混响尾巴**（A7 的 `reverb.rs` 仍在 CPU；M6 只到二阶，
           且"卡上全枚举不截断" ⇒ 与 CPU 同解带 `max_reflections ≥ n_tris` 的前提）。
          portal 与衍射棱都按文档 §8 的取舍先落"显式图元"；**两半的兜底都已落** —— 衍射棱的
          自动认边见 `a4_auto_edges`，portal 的**体素空洞自动识别**见 `a10_portal_autodetect_landed`
          （2026-10-16）。低频不承诺 / **不做双耳渲染**见文档 §7
          （2026-10-12 起有**单声道**离线渲染供试听与对表，见 `a6_audio_render`；HRTF/双耳仍归宿主）。
      - id: a4_diffraction_landed
        note: >-
          **A4「衍射」已落地（2026-10-11）**：`Edge { a, b, coeff: [f32; BANDS] }` —— **作者显式声明的
          衍射棱**（同 portal 的思路：不从三角网格自动认边，那要先定凸凹/共面语义）；棱上取
          **Fermat 点**（`|声源−P| + |P−听者|` 最小：凸性 + 定次数二分 ⇒ 逐位可复现，夹到端点就是
          "从棱端绕"）；**只在阴影里**产出（直达通视就不算绕射，与直达不重复计能）。能量口径
          `coeff_b · D(θ) · 介质衰减 / (d1·d2)`、`D(θ) = (1+cosθ)/2`（掠射 `D → 1`，与自由场连续）。
          判据 `tests/a4_diffraction.rs` 5 条：拐角后仍可闻且折线长与**暴力扫棱**一致、阴影越深越弱
          （严格单调）且出阴影后直达接管、棱的半截（端点解）也对、绕射腿被挡死则无路径、逐带系数
          ⇒ 带比等于系数比 + `max_edges` 预算 + 逐字确定性 + `state_hash` 不变。
          ⚠️ 当时**不做** Fresnel 积分与楔角 UTD 系数（散射那一半见下条 `a4_scatter_landed`）；
          **刀刃 Fresnel 已由 A9a 补上（2026-10-16）**，**一般楔角 UTD 系数已由 A9b 补上（2026-10-16，见 `a9b_wedge_landed`）**。
      - id: a4_scatter_landed
        note: >-
          **A4「散射」已落地（2026-10-11）**：逐面 `scattering: [[f32; BANDS]]`（**外部表**，缺了按
          `[0;BANDS]` = 纯镜面 ⇒ A1–A3 数值逐位不变）。分工是**能量守恒式**的：镜面那条按 `(1 - s_b)`
          打折，剩下的由**漫反射二级声源**（新路径种类 `Scattered`）接手 ——
          `gain_b = s_b · cos_in · cos_out · A / (d1²·d2²)`（**工程口径**：面积 × 两个余弦 × 散射系数 /
          两段距离平方；不承诺辐射度单位，要真辐射度得离线烘焙）；法向朝声源那一侧、两个余弦 > 0、
          两条腿都不被挡才产出；预算 `max_scatters`、统计 `scattered`。
          判据 `tests/a4_scatter.rs` 5 条：能量分工（`s=0.6` ⇒ 镜面恰好是原来的 0.4、且多出散射路径）、
          散射增益与**闭式口径**对拍且对系数**线性**、**Lambertian**（同距离下绕离法向 60° 恰好弱一半）、
          腿被挡则无路径、逐带系数 ⇒ 带比等于系数比 + 预算 + 逐字确定性 + `state_hash` 不变。
          ⚠️ 散射这一半仍是工程近似（Lambertian，不做真辐射度）；`D(θ)` 的 Fresnel 积分已由 A9a 补上（2026-10-16），一般楔角系数已由 A9b 补上（2026-10-16）。
      - id: a5_landed
        note: >-
          **A5 已落地（2026-10-11）**：动态源/听者本来就成立（声源逐 tick 取 `World::impacts()`、
          听者位置每次调用由调用方给）；这一期补的是**预算与实时档**：
          ① **产出按优先级（能量）截断**到 `max_paths`（先收本 tick 的候选，再 `sort_by` 稳定排序取
          最响的 K 条 —— 平局仍按产出顺序，逐位可复现），丢弃数如实计入 `dropped_budget`；
          候选侧的四个上界（`max_reflections` / `max_portals` / `max_edges` / `max_scatters`）仍是**工作量**上界。
          ② `AcousticTier { Offline, Realtime, Minimal }` = **确定性的工作量上界预设**（`config()` 给旋钮组合；
          **不是墙钟预算** —— 宿主想帧率自适应请自己选档）。
          判据 `tests/a5_realtime.rs` 4 条：留下的必须是**最响的 K 条**且丢弃数 = 候选数 − K、
          档越省候选越少且 `Minimal` 不算反射（顶满时上报）、移动听者下**时延受几何界、增益受
          Lipschitz 界（`2/d³·Δd`）、路径数不抖**、同扫掠两跑逐字一致 + `state_hash` 不变。
          CLI 加 `--realtime`（同一房间：全量 1421 行 → 实时 1064 行）。**GPU 档**仍未做。
      - id: a4_auto_edges
        note: >-
          **自动认边已落地（2026-10-11）**：`AcousticGeometry::detect_edges(&EdgeDetect)` —— 从三角
          网格里认出**边界棱**（只被一个三角用 ⇒ 刀刃）与**凸棱**（二面角 ≥ `min_wedge_deg`，且相邻
          面的第三顶点在第一个面平面的外侧）；跳过共面/微折、**凹**棱与相邻面多于两个的非流形棱。
          ⚠️ 前提是**三角绕序朝外一致**（凸凹判据依赖它）；顺序按顶点对字典序 ⇒ 逐位可复现。
          判据 `tests/a4_auto_edges.rs` 5 条：盒子恰好 12 条凸棱（6 条面对角线不算，测试自查绕序朝外）、
          平板留 4 条边框而不留中间对角线、**凹接缝不算**、浅折由 `min_wedge_deg` 卡（阈值两侧各取
          一档、自校准折角）、认出来的棱直接驱动 A4 绕射且最短折线与**暴力扫棱**一致。
          ⚠️ **已知边界**：自动认边会把"墙立在地板上"这类**顶点不共享**的接缝也认成边界棱，而那种楔
          在物理上是**凹**楔（UTD 刀刃公式不适用）⇒ 自动认边适合**独立薄片/道具**（真有刀刃），
          房间级接缝更该由作者显式标（文档 §8 把自动认边列为兜底正是这个理由）。
      - id: a3_refraction_landed
        note: >-
          **折射（Snell 折转）已落地（2026-10-11）**：`AcousticMedium::refracted(src, dst, iters)`
          （默认 `None` = 不建模折射；折线由**介质自己**给 —— 只有它知道层界，本层只做逐段遮挡检查）
          + 新路径种类 `Refracted` / 统计 `refracted` / `AcousticConfig::refraction_iters`（定次数）。
          `LayeredMedium` 的实现用**水平慢度守恒** `p = sinθ/c`：对 `p` 做**定次数二分**找到把声线
          正好送到听者的那个值（`run(p)` 单调 ⇒ 二分正确），折点落在层界上；需要的 `|p|` 超过
          `1/c_max` 就返回 `None`（这就是模型里的**临界角**约束）；**均匀则返回 `None`**（直线就是解，
          交给直达那条，避免重复计能）。判据 `tests/a3_refraction.rs` 5 条：① 折点上的 **Snell 定律**
          （`sinθ/c` 两侧相等，相对 1e-3）+ 折线旅行时等于**暴力扫界面点**的最小值（相对 1e-4）+
          比直线积分更快（**Fermat**）；② 路径级：时延/逐带衰减/到达方向与介质给的一致；
          ③ 均匀介质不折；④ 折线任一段被挡 ⇒ 不产出（去掉挡板就有）；⑤ 确定性 + `state_hash` 不变。
          ⚠️ 边界：只做**分层（水平层界）**介质；曲面/一般体积场要折线就自己实现 `refracted`。
      - id: a5_gpu_base
        note: >-
          **GPU 档的"基础件"已落地（2026-10-12）**：几何与材质表本来就是**平铺切片**（`&[Vec3]` /
          `&[[u32; 3]]` / `&[[f32; BANDS]]`）⇒ 上传给计算着色器不需要再打包；在此之上加
          `AcousticsExt::acoustic_cues_batch`（对**一批听者**归约）。契约三条：① **逐位等价** ——
          批里每个听者的结果与单独调 `acoustic_cues` 完全相同；② **输出分段** —— 每个听者的路径
          连续成段、段长 = `AcousticStats::paths()`；③ **逐听者预算** —— `max_paths` 不跨听者共享
          （否则后面的听者会被前面的饿死）。为此把统计口径改成**产出**（截断后重算逐类计数；
          候选侧丢弃仍记 `dropped_budget`），`Listener` 也补了 `Copy`。
          判据 `tests/a5_gpu_batch.rs` 4 条（逐位等价 / 逐听者预算（1 条额度 × 3 听者 ⇒ 恰好 3 条，
          共享预算时后两个会变 0）/ 空批与单元素批 / 确定性 + `state_hash` 不变）。
          ⚠️ **设备内核仍未做**（属 `vxl-phys-gpu`：那里才有 wgpu 会话；既有口径
          `cargo test --workspace --exclude vxl-phys-gpu` ⇒ headless CI 不跑 GPU 用例）。
      - id: a5_gpu_direct_kernel
        note: >-
          **GPU 档的「直达核」（M1）已落地（2026-10-12）**：`vxl-phys-gpu` 的
          `src/acoustic.rs` + `src/acoustic.wgsl` —— 一批 `(声源, 听者)` 对，每对一个工作项
          （`@workgroup_size(64)`），核内走**真正的射线-三角**（Möller–Trumbore，端点共面不计）
          + `dist/speed` 与 `1/dist²`；与 CPU 端 `vxl-phys-acoustics` 的直达同口径。
          复用既有的 `pipeline::gpu_setup`（`mk_layout`/`mk_pipe`/`dispatch`/`ent`/`f32_bytes`）与
          `mapped::mapped_view` 回读 ⇒ **不引新依赖、不用 unsafe**。
          探针 `crates/vxl-phys-gpu/tests/acoustic_direct_probe.rs`：场景是**轴对齐屏障**，参照值用
          纯算术写（线段与 `z=1` 的交点落不落在矩形内），与卡上跑的**不是同一份实现** ⇒ 不是自证。
          判据 = **拓扑（遮挡分类）逐位 + 浮点（时延/增益）相对 1e-4**；无适配器则打印 `[SKIP]`。
          实测（本机）：`NVIDIA GeForce RTX 4060 Ti | Vulkan | DiscreteGpu` 上 6 对全对。
          ⚠️ **CI 不覆盖**（既有口径 `cargo test --workspace --exclude vxl-phys-gpu`：headless 运行器
          无 GPU）⇒ 这条路只能在本机或 GPU 探针 job 上验；**五条腿（M1–M5）此后都已上卡**。
      - id: a5_gpu_reflect_kernel
        note: >-
          **GPU 档的「一次镜面反射」（M2）已落地（2026-10-12）**：`acoustic.wgsl` 加 `reflect` 入口 ——
          逐三角跑**镜像源法**（镜像听者 + 平面求交 + 重心内点 + 两段遮挡），逐对取**最强那条**
          （平局按三角序号取小 ⇒ 确定），输出 `(hit, delay, gain, tri)`；吸收表按三角逐个读
          （`(1-a)/(d₁+d₂)²`）。宿主侧把两个入口的缓冲/回读抽成共用件，并新增
          `acoustic::reflected_on_adapter`。
          探针 `crates/vxl-phys-gpu/tests/acoustic_reflect_probe.rs`：地板 `y = 0` 场景，参照值用
          **镜像展开**手算（`L = |src' − dst|` ⇒ 时延 `L/c`、增益 `1/L²`），与卡上的逐三角实现
          **不是同一份**；第二段再插一块**全吸收**挡板（它自己不成反射面）⇒ 折线被遮就**不得**
          报出反射。实测（本机 RTX 4060 Ti | Vulkan）：两段顺序跑 2.6 s 全过。
          ⚠️ **两条测试不要并行**：并行会各建一个 wgpu 设备，实测互相卡住 ⇒ 探针里合成**一条**测试
          （文件头注写明了这条坑）。CI 同样不覆盖（`--exclude vxl-phys-gpu`）。
      - id: a5_gpu_diffract_kernel
        note: >-
          **GPU 档的「绕射」（M3）已落地（2026-10-12）**：`acoustic.wgsl` 加 `diffract` 入口 ——
          逐棱取 **Fermat 点**（定次数 **48** 的二分，与 CPU 的 `FERMAT_ITERS` 同值 ⇒ 同样的定次数、
          无早退、逐位可复现）、**只在阴影里**产出（直达通视就整对跳过，不与直达重复计能）、逐对取
          **最强那条**（平局按棱序号取小 ⇒ 确定），输出 `(hit, delay, gain, edge)`；口径
          `coeff·(1+cosθ)/2/(d₁·d₂)`（**旧口径**；2026-10-16 起按 `band_hz` 可切 A9a/A9b 口径，
          见 `a9b_wedge_kernel`。仍是**单频带**：频带表与介质衰减还没上卡）。宿主侧把输入收口成
          `acoustic::SceneIn`（`diffract` 这条本来要 7 个形参、撞 args-gate 的软阈值 ⇒ 打成结构体），
          棱表与逐棱系数各一张缓冲（空表补**非零长**的哑缓冲）。
          探针 `crates/vxl-phys-gpu/tests/acoustic_diffract_probe.rs`：一把刀口（屏障的顶棱）——
          参照值是**手算的对称驻点**（`x = 0` 处两项余弦等值反向 ⇒ 驻点在棱的中点）与沿棱
          **暴力扫 20001 点**的最小折线长，与卡上那 48 次二分**不是同一份实现**；六段顺序跑
          （5 趟）：
          闭式对拍 / 同输入两跑逐位一致 / 暴力扫最小值 / **两条棱取最强**（弱的那条排在前面 ⇒
          证明扫的是全表而不是第一条）/ 第二腿被挡不产出 + 阴影外不产出。实测（本机
          RTX 4060 Ti | Vulkan）：4.8 s 全过。⚠️ CI 同样不覆盖（`--exclude vxl-phys-gpu`）。
      - id: a6_audio_render
        note: >-
          **A6「离线音频渲染」已落地（2026-10-12）**：`crates/vxl-phys-acoustics/src/audio.rs` ——
          cue 流（`SoundPath`）→ **能听的波形**（调研文档 §8 第 3 条的落地：音效师拿它**对表**、
          集成方拿它**回归**）。两条口径：**幅度 = `sqrt(能量)`**（`bands` 是能量增益）、**不乘**
          `SoundPath::gain`（它就是中频带，乘了等于中频带计能两次）。逐带分频是两级一阶低通
          （`低 + 中 + 高 ≡ 原信号` ⇒ 完美重构，f32 下只差舍入）；按 `delay` **量化到整数采样**直叠；
          WAV 只做 PCM16 写 + PCM16/float32 读（多声道降混）——**零新依赖**。
          判据 `tests/a6_audio.rs` 6 条：① 尖峰 = 时延（±1 采样）、尖峰高 = `sqrt(能量)`；
          ② 叠法与测试侧手算的参照逐采样一致（≤1e-6）；③ 分带**行为**单调（60 Hz 走低带 ≥10×、
          2 kHz 走中带、12 kHz 走高带 ≥10×）；④ **闷响**（低通激励）的首达落在 `delay` 上（±4 采样）且更远更弱、**激励本身要"暗"**（高频带 ≪ 低频带 —— 2026-10-12 加：宽带噪声当激励叠上尾巴听着像"电锯"）；
          ⑤ WAV 往返（量化 ≤2e-5）+ 立体声降混 + 非 WAV 报错（不猜）；⑥ 真实场景端到端
          （体素地面砸出的冲击 ⇒ 绕射/反射路径渲成**有声且有限**的波形、两跑**逐位一致**（含 WAV
          字节）、渲染前后 `state_hash` 不变）。
          ⚠️ 边界：**单声道**（HRTF/双耳不做）、时延量化到采样（48 kHz ≈ 21 µs）、**没有混响尾巴**
          （只渲**早期**显式路径）；晚期混响由 A7 补（`a7_reverb_tail`，CLI 加 `--reverb`）—— 多次反射的**逐个展开**仍在路线图外。
          ⚠️ **干信号只认 WAV**（PCM16 / float32、多声道降混）：mp4/m4a/mp3 这类**压缩容器本层不解码**
          （引解码器要背编解码器与许可那一摊子）—— CLI 见到这些扩展名会直接把转码命令打出来；
          本机工具 `C:\vxl-wl-tools\ffmpeg.exe`（**CI 不需要**）。⚠️ 输出窗长按**干信号自己的长度**留
          （至少 2 s）：只按 `ticks` 算会把长素材的尾巴**截掉**（2026-10-12 实测踩到并修）。
          CLI：`vxl-phys audio <voxel> [ticks] <出.wav> [干信号.wav]`（默认激励 = 确定性的**闷响** `audio::knock`，低通的；
          写盘前按峰值归一，比例打印）。实测（本机 2026-10-12）：单声撞击的 IR 里 5 条路径
          （透射 9.431 / 门洞 9.934 / 绕射 11.885 / 反射 32.576 / 漫反射 34.023 ms）与渲染出的尖峰
          逐条对上、**最大偏差 0.00 dB**；6 s 场景（214 声事件 / 1421 条路径）峰值 1.57 ⇒ 归一 ×0.637 落盘。
      - id: a5_gpu_scatter_kernel
        note: >-
          **GPU 档的「散射」（M4）已落地（2026-10-12）**：`acoustic.wgsl` 加 `scatter` 入口 —— 逐三角
          取**面中心**当二级声源（Lambertian 工程口径）：法向朝声源那侧、要求声源/听者**同侧**且两个
          余弦 > 0、两条腿都不被挡，逐对取**最强那个面**（平局按三角序号取小 ⇒ 确定），输出
          `(hit, delay, gain, tri)`；口径 `s·cos_in·cos_out·A/(d₁²·d₂²)`（`A = |cross|/2`，
          **单频带**系数）。宿主侧 `SceneIn` 加 `scatter` 表（空表 = 全 0 = 纯镜面），新增
          `ScatterOut` / `scattered_on_adapter`。
          ⚠️ 顺手补了一个**越界读隐患**：逐三角表（吸收 / 散射）空表时按**三角数**补零、非空但给短了
          直接报错 —— 核内是 `absorb[t]` / `scatter_coef[t]` 直接索引，只补 1 个元素的话"空表 +
          多个三角"就是越界读（反射那条以前也踩在这个坑边上）。
          探针 `crates/vxl-phys-gpu/tests/acoustic_scatter_probe.rs`：一块 `y = 0` 的直角三角地板
          （面积 2、重心 `(2/3, 0, 2/3)`），声源悬在重心正上方 1 m、听者距重心 2 m 按角度摆 ⇒
          **手算就是 `gain = 0.5·cosθ`**：判据全用手写常数（`0.5` / `0.4330127` / `0.25` /
          `0.12940952`），其中"**绕离法向 60° 恰好弱一半**"单独钉一次；再补四条否证/边界：听者不在
          同侧 ⇒ 不产出；到听者那条腿被挡 ⇒ 不产出；**取最强那个面**（弱的小面排前面、放大 2 倍的
          面排第二 ⇒ 必须选第二条；再把那个强面的系数设 0 ⇒ 落回小面）；同输入两跑**逐位一致** +
          空散射表 ⇒ 一对也不产出。实测（本机 RTX 4060 Ti | Vulkan）：五段 7.3 s 全过；与
          直达/反射/绕射三条探针一起复跑也全过。⚠️ CI 同样不覆盖（`--exclude vxl-phys-gpu`）。
      - id: a5_gpu_medium_kernel
        note: >-
          **GPU 档的「介质积分」（M5）已落地（2026-10-12）**：`acoustic.wgsl` 加 `medium` 入口 ——
          **水平层表 + 定步数中点采样**（`medium_steps`，`0` 按 1 算；无早退 ⇒ 逐位可复现）：
          逐子段取中点查层表拿 `(c, α_低, α_中, α_高)`，累加 `Σ len/c` 与 `Π exp(-α_b·len)`；
          输出行是 `(用时, 衰减低, 衰减中, 衰减高)` —— **这条没有 hit 位**（直线段永远算得出来）。
          层表按 `y` 升序、不重叠，取**第一命中**，没命中就是空气（`speed` + 零吸收）。
          宿主侧新增 `Slab` / `MediumOut` / `MediumIn` / `medium_on_adapter` 与**自有绑定布局**
          （`0` 参数 / `1` 起点 / `2` 终点 / `9` 层表 / `4` 输出；M1–M4 那套不动）；`Params` 的
          三个占位 pad 换成 `n_slabs` / `medium_steps` / `_pad`（仍是 32 B），宿主侧收口成
          `Params` 镜像结构体（形参到 7 个会撞 args-gate 软阈值），回读抽成两个入口共用的 `read_rows`。
          ⚠️ **折线（折射）由宿主逐段调用后组合**：时延**相加**、衰减**相乘** —— 两者都是可分量
          ⇒ 与"一次算完折线"等价（判据里钉了组合性；⚠️ 严格成立的前提是同一采样集合）。
          探针 `crates/vxl-phys-gpu/tests/acoustic_medium_probe.rs`：段 `(0,0,0)→(0,4,0)`、
          层界 `y = 2`、**每段 8 步**（子段 0.5 m、中点 y = 0.25…3.75 ⇒ 前 4 个中点在下层、
          后 4 个在上层）⇒ 参照是**手算的跨层分段和**（`2/c_下 + 2/c_上` 与
          `exp(-0.8 / -1.6 / -3.2)`）。六段判据：纯空气/层表没覆盖 = 闭式 `len/speed`；均匀层 =
          `exp(-α·len)`（`e^-1 / e^-2 / e^-4`）；**跨层中点采样**手算分段和；单调性（吸收越大越弱、
          声速越大越快）；**组合性**（4 m 16 步 = 两段 2 m 各 8 步，逐段相加/相乘）；确定性 +
          `steps = 0` 按 1 算。实测（本机 RTX 4060 Ti | Vulkan）：六段 14–18 s 全过；
          五条探针一起复跑也全过。⚠️ CI 同样不覆盖（`--exclude vxl-phys-gpu`）。
      - id: a5_gpu_reflect2_kernel
        note: >-
          **GPU 档的「二阶反射」（M6）已落地（2026-10-16）**：`acoustic.wgsl` 加 `reflect2` 入口 ——
          逐对面 `(面 A, 面 B)`（`A ≠ B`，同面连打两次 = 原路返回 ⇒ 跳过）做**两跳镜像展开**：
          听者先按 `B`、再按 `A` 镜像，两个反射点各自落在对应三角内、三段腿都不许被**链外的面**挡
          （链上两张面跳过 ⇒ `blocked` 收成 `blocked2` 的单面退化，M1–M4 读数**逐位不变**），
          逐对取**最强那条**（平局按 `(A,B)` 序号取小 ⇒ 确定），增益 `(1-a_A)(1-a_B)/(总程长²)`、
          时延 `总程长/speed`，输出行 `w` 报**第一跳**的面序号（诊断用）。
          ⚠️ **卡上不做预算截断**（与 M1–M5 同口径：卡只负责"给定场景逐对取最强"，预算/阶数归宿主）
          ⇒ 与 CPU `reflection_order = 2`（A8，见 `a8_multibounce`）**逐对一致的前提**是 CPU 侧
          `max_reflections ≥ tris.len()`（不截断才同解）；CPU 的 `dropped_budget` 在卡上没有对应信号。
          **未上卡**：更高阶（>2）与 A7 的统计混响尾巴（仍在 CPU）。
          宿主侧入口单开在 `crates/vxl-phys-gpu/src/acoustic/reflect2.rs`（`Reflect2Out` +
          `reflected2_on_adapter`；`acoustic.rs` 已贴 god 门 800 行上限 ⇒ 新腿落子模块，父模块只加
          `mod`/`pub use` 两行）。每对 `O(n_tris³)` ⇒ 只对离线、小场景有意义。
          探针 `crates/vxl-phys-gpu/tests/acoustic_reflect2_probe.rs`：场景是**两个平行平面**
          （地板 `y = 0` / 天花板 `y = 3`），参照用**闭式展开高度表**（一阶两条 + 二阶两条，与 CPU
          A8 判据同一张表）⇒ 与卡上不是同一份实现。六段判据：① 二阶 = 最强那条（F→C）时延/能量
          对上手算且比 C→F 强、第一跳报在地板；顺带再钉一次 M2 一阶读数（`blocked2` 重构的护栏）；
          ② **阶数上界**（只有一张面 ⇒ 二阶一条不产，一阶照旧）；③ **有效性**（地板换成小三角 ⇒
          碰地板的链全不成立，天花板那条一阶照旧）；④ **中段被挡**（全吸收挡板切在二阶中段 ⇒ 二阶全没，
          一阶地板照旧 —— 挡板增益 0 抢不走"最强"位，于是"只遮不反"）；⑤ 表长守卫（`is_err`）；
          ⑥ 两跑**逐位一致**。实测（本机 RTX 4060 Ti | Vulkan）：delay `0.016958` / gain `0.01891650`
          与手算**逐位同屏**，六段全过；七条声学探针一起复跑也全过。
          ⚠️ CI 同样不覆盖（`--exclude vxl-phys-gpu`）；⚠️ 探针内**不能**调 CPU 的 `bounce.rs` 当参照
          （`vxl-phys-gpu` dev-depend `vxl-phys-acoustics` 会撞 `dag-gate` —— 后端不许依赖领域，见文档 §9 坑 #4）。
      - id: a7_reverb_tail
        note: >-
          **A7「统计混响尾巴」已落地（2026-10-12）**：早期声仍由显式路径给（A1–A6），**晚期**
          （密反射）用统计模型补 —— `crates/vxl-phys-acoustics/src/reverb.rs` + `audio::mix_reverb_tail`（尾巴 = 干信号 ⊛ **稀疏衰减核**。`n        —— 2026-10-12 两次迭代：先修"高频限带"（电锯味），再改成**卷积**（"包络 × 白噪"的旧法把干信号的内容换成噪声 ⇒ 听感是"气声/呼吸声"）；判据 ⑧ 用纯正弦钉住"弦进、弦出"。）。
          **只有 RT60 是物理的**：`RT60_b = 0.161·V/(S·ᾱ_b)`（Sabine）—— `V` = 声学几何围出的体积
          （散度定理逐三角求和）、`S` = 总表面积、`ᾱ_b` = **面积加权**平均吸声，三个量都来自
          `AcousticGeometry` 自己的表（不看碰撞体、不看 `World`，纯函数 ⇒ 同输入逐位同输出）。
          **干湿比是工程常数**（`MIX = 0.2` ≈ −14 dB，与"直达/混响能量比" `16πd²/(c·S·ᾱ)` 在
          `d ≈ 3 m`、`S ≈ 120 m²`、`ᾱ ≈ 0.25` 下的量级对得上）。
          **尾巴起点** = 平均自由程 / 声速（`4V/(S·c)`）。
          ⚠️ 几何不闭合（开场景 / 只建了参与显式路径的那几面）⇒ **关掉尾巴**；要尾巴就
          `reverb_params_from(geo, cfg, V, S)` **声明包络**（与 `Portal`/`Edge` 同一条"显式拓扑"思路），
          声明表面积里没建出来的面按**零吸声**算（保守 ⇒ 尾巴偏长）。
          合成是**确定性的能量包络跟随**（不做真卷积：10 s × 2 s @ 48 kHz ≈ 1e10 次乘加不值得上 FFT；
          冲激情形与真卷积同形）：定种 LCG 噪声（**种子随发声时刻变** ⇒ 多声事件不相干叠加）+ 递归
          能量包络 + `sqrt(1−keep)` **归一化**（不归一化的话持续声源的尾巴会长出 ~40× —— 实测踩到：
          一段素材渲出来峰值 2.87、归一化后早期声被压掉 9 dB）+ 噪声**逐带限带/逐带归一**（同一段
          噪声过同一套分频器、带 b 只用带 b 的那一份 ⇒ 尾巴的频谱**跟着干信号走**；不这么做高频会
          是干信号的 **7 倍** —— "电锯烤铁"那个听感就是它，2026-10-12 实测并修：6k+12k 占比
          64.1% → 0.15%）。
          判据 `crates/vxl-phys-acoustics/tests/a7_reverb.rs` 9 条（新增 ⑧ **尾巴是混响不是噪声**：纯正弦进 ⇒ 尾巴在周期上的自相关 ≥ 0.8，旧法在这里 ≈ 0）：鞋盒 `4×3×2.5 m` 的 Sabine 绝对值
          （`RT60 = 0.161·30/(59·0.2) = 0.40932 s`、`onset = 5.931 ms`、`mix = 0.2·0.8`）/ 逐带
          `RT60 ∝ 1/α`（0.1/0.2/0.4 ⇒ 4:2:1）/ 吸声**面积加权**（半边 0.1 半边 0.5 ⇒ ᾱ = 0.3）/
          不闭合 ⇒ 没尾巴 / **相隔一个 RT60 的两个同宽窗能量密度差 −60 dB**（±3 dB）/ 声明包络
          （拆了一面墙仍能算，且 `V`/`S` 非正 ⇒ 关）/ 边界与确定性 / 零干扰（`state_hash` 不变）。
          CLI：`vxl-phys audio ... --reverb`（演示房间是声明的半开放几何 ⇒ 按**听者那间屋**的声明包络
          `8×6×2.5 m` 算，实测 `RT60 0.55/0.46/0.44 s`；尾巴比干信号低 ~12 dB）。
          ⚠️ **这是统计尾巴**，不是"第 2..N 次镜像反射逐个展开"（那要指数爆炸 + 可见性剪枝）。
      - id: a8_multibounce
        note: >-
          **A8「多次反射」（二阶镜像展开）已落地（2026-10-12）**：`crates/vxl-phys-acoustics/src/bounce.rs`
          + `AcousticConfig::reflection_order`（默认 `1` = A1–A7 的行为，逐位不变；`2` 才做二阶；
          `>2` 按 2 处理）。口径四条：① **展开（unfolding）**——把听者沿链上各面逐面镜像得 `L₁`，
          折线长 = `|src − L₁|`、各反射点 = 逐段与对应面求交（与一次反射的镜像源法同构造）；
          ② **有效性**——每个反射点必须落在三角**内部**、两两之间的子段都不能被挡
          （⚠️ 检查时**跳过链上的面**：子段本来就在那些面上起落 —— 低阶镜像展开的常用取舍，
          代价是"同一面被穿过两次"这类路径可能多算一条，2 阶下可接受）；
          ③ **能量** = `Π_k (1−α_{f_k,b}) · Π_k (1−s_{f_k,b}) · 介质逐段衰减 / L²`（与一次反射同口径）；
          ④ **预算与确定性**——链上**每阶段**最多试 `max_reflections` 张面（超了如实进 `dropped_budget`）、
          按三角索引序、同一张面连续出现两次的链跳过（原路返回，退化）⇒ 同输入逐位相同。
          ⚠️ 成本 ≈ `max_reflections²` 条链（每条 3 段遮挡检查）⇒ **只建议离线档开**（实时档预设不动）。
          判据 `tests/a8_bounces.rs` 6 条：两块水平面（地板 `y=0` / 天花板 `y=3`）的**闭式**对拍
          （一阶 `√(Δx²+(y_s+y_l)²+Δz²)`、二阶 `√(Δx²+(y_s−y_l+6)²+Δz²)` 等四条，能量 = `Π(1−α)/L²`）/
          `order = 1` 时两条二阶**都不在** / **有效性否证**（地板换成装不下反射点的小三角 ⇒ 所有碰
          地板的链全消失、只剩天花板那条）/ **遮挡否证**（挡死二阶中段 ⇒ 二阶全没、一阶还在，非空洞）/
          预算（每阶段 1 面 ⇒ 只剩一条二阶且 `dropped_budget` 如实上报；`= 0` ⇒ 一条反射都没有）/
          确定性 + `state_hash` 不变 + `order > 2` 按 2 处理。
          **口径已上卡（2026-10-16）**：GPU 档 M6 的 `reflect2` 入口 + `src/acoustic/reflect2.rs`，
          见 `a5_gpu_reflect2_kernel`（卡上**全枚举不截断** ⇒ 与这条同解带 `max_reflections ≥ n_tris`
          的前提；CPU 的 `dropped_budget` 在卡上没有对应信号）。
          CLI：`acoustic` / `audio` 加 `--order2`。实测（本机，`voxel` 场景单声撞击）：默认 5 条 cue
          （透射 9.431 / 门洞 9.934 / 绕射 11.885 / 反射 32.576 / 漫反射 34.023 ms），`--order2` 多一条
          **34.187 ms 的二阶反射（能量 0.00182，比一阶那条 0.00323 更晚更弱）** —— 多一次弹跳 = 更长的
           路 + 多一份吸声，方向是对的。
      - id: a9a_fresnel_utd_landed
        note: >-
          **A9a「刀刃（半平面）真 Fresnel 绕射」已落地（2026-10-16）**：`crates/vxl-phys-acoustics/src/utd.rs`
          —— 真 Fresnel 积分 `C(x)/S(x)`（**两段式**：`x < 2.5` 幂级数、`x ≥ 2.5` 渐近展开；**全 f32**
          （SPEC §5「严格 f32」，实测两段最坏误差 ~1.4e-5，渐进段按**项比递推**避 `(4m±1)!!` 溢出）；
          `ν = 2√(Δ/λ)`，`Δ` = Fermat 折线超出直连的**多余路程**、`λ = c/band_hz`；
          能量比 `|E_d/E₀|² = ½[(½−C(ν))²+(½−S(ν))²]`。**逐带显式频率**
          `AcousticConfig::band_hz: [f32; BANDS]`（⚠️ **口径变更**：默认 `[0.0;BANDS]` = 不给绝对频率 ⇒
          逐带退回 A4 旧口径 `(1+cosθ)/2`、**逐位不变**；`band_hz[b] > 0` 该带才切真 Fresnel）。
          ⚠️ **口径修正（设计内 loud change）**：阴影边界 `ν = 0` ⇒ 能量比恰 `1/4` = **−6.02 dB**
          （旧口径掠射 `D → 1`）；给绝对频率的那一带会相对旧值变化 —— 这是"真 Fresnel"的应有结果。
          判据 `tests/a9_utd.rs` 8 条：表值（对独立 Python Simpson 积分 `n=20000`）/ 导数据恒等式 /
          奇对称 `C(−x)=−C(x)` 逐位 / 阴影边界 −6.02 dB 且严格单调 / `ν` 与经典刀口
          `ν = h√(2(s+s')/(λ·s·s'))` 等价 / 默认无频率 = 旧口径 / 显式频率切真 Fresnel 对独立积分 /
          逐字确定性 + `state_hash`。
          ⚠️ **一般楔角 UTD 系数**已由 A9b 补上（2026-10-16，见 `a9b_wedge_landed`）。
      - id: a9b_wedge_landed
        note: >-
          **A9b「一般楔角 UTD 修正」已落地（2026-10-16）**：`crates/vxl-phys-acoustics/src/utd.rs`
          —— `Edge::wedge: Option<Wedge>`（`Wedge { interior_angle, face0: Vec3 }`；**默认 `None` = 刀口
          ⇒ A9a/A4 逐位不变**）。`Some(Ω)` 时按 **Kouyoumjian–Pathak 软边界系数** `D_soft`
          （`cot(·)·F(·)` 两项、过渡函数 `F(χ)` 由 `C/S` 闭环求值；**全 f32**）算**楔角修正因子**
          `fac = min(|D_n|²/|D_2|², WEDGE_FACTOR_MAX=4)`（`n = 2 − Ω/π`）——
          口径 = **分母地板 + 钳位**（实测 `|D_n|²/|D_2|²` 中位 ~1、长尾到 1e6；比值在参考刀刃系数
          趋零处发散，故钳到 4），乘到 A9a 的刀刃口径上：`df = knife_gain(ν) · fac`。
          **`n = 2`（`Ω = 0`，刀口）⇒ `fac` 恰 `1`（逐位回到 A9a）；`n = 1`（`Ω = π`，平壁）⇒ `0`**。
          口径备注：`β⁻ = φ − φ'` 无需参考向、`β⁺ = φ + φ'` 需 `face0` 定向；源/听者应在楔**外场区**。
          判据 `tests/a9b_wedge.rs` 10 条：`n=2` 恰 `1` / 平壁恰 `0`（内角越界钳）/ **有界 `[0,4]` 且非 `NaN`**
          + 方向性 / **互易**逐位 / 对**独立 KP（Python `f64`）**数值一致 / 端到端 `Ω=0` 与 `None` **逐位相同**
          （含 `Ω=π` 把路径能量**清零**）/ 默认（不给频率）忽略楔角 / 有界 / 只读 + `state_hash`。
      - id: a9b_wedge_kernel
        note: >-
          **A9a/A9b 上卡（2026-10-16）**：`crates/vxl-phys-gpu/src/acoustic.{rs,wgsl}` 的 M3 绕射核
          从**旧口径** `D(θ) = (1+cosθ)/2` 升到 **A9a 真刀刃 Fresnel × A9b 一般楔角修正**（与 CPU
          `utd.rs` 同式，**全 f32**）。宿主 `acoustic::upload(.., wedges, band_hz)` 多传一份**逐棱
          楔角表**（每棱 1 个 `vec4` = `Ω|face0.xyz`；空表补非零长哑缓冲）与**绝对频带**；
          `λ = max(speed,1e-3)/band_hz` 在宿主算好写进 `Params.lambda`（`Params` 仍是 8 字段 / 32 B：
          原 `_pad` 换成了 `lambda`）。**两条 lane（按 `band_hz` 切）**：
          `band_hz ≤ 0` ⇒ `lambda = 0` ⇒ 核内整段不跑 ⇒ **旧口径逐位不变**（`diffracted_on_adapter`
          保留为薄壳，与 `diffracted_wedge_on_adapter(.., &[], 0.0)` 逐位相同）；`band_hz > 0` ⇒
          `gain = coeff·knife_gain(ν)·fac/(d₁·d₂)`，`ν = 2√(Δ/λ)`、`fac` = 楔角修正
          （`Ω ≤ 0` ⇒ `fac = 1` 逐位回刀口；`Ω = π` ⇒ `fac = 0` ⇒ 整对不产出）。
          探针 `crates/vxl-phys-gpu/tests/acoustic_wedge_probe.rs`（一条测试五段顺序跑，避"一文件两设备"
          死锁）：参照是**在测试里另写的一份 `f64` + `C/S` 走 Simpson 数值积分**的独立实现
          （**不能** dev-depend `vxl-phys-acoustics` —— `dag-gate` 禁止后端 crate 依赖领域 crate）——
          刀刃 `0.0070336973` vs 参照 `0.0070336955`、楔角 `0.02813479` vs `0.028134782`
          （差 ~`3e-7` = f32 舍入）；另测旧口径**逐位不变**（三处）/ `Ω=π` 不产出 / 楔角表长度不符报错。
          ⚠️ CI 同样不覆盖（`--exclude vxl-phys-gpu`）。
      - id: a10_portal_autodetect_landed
        note: >-
          **A10「体素空洞自动识别」已落地（2026-10-16）**：`crates/vxl-phys-acoustics/src/portal.rs` ——
          **从占据位找连通孔**（设计文档 §8 待裁项①、"显式图元优先、自动兜底"里的兜底那一半）。
          口径：**空 = `!占据`**（`VoxelOccupancy { origin, step, dims, occupied }`，行主序
          `ix + nx·(iy + ny·iz)`、越界/短表按实心）；先按**切比雪夫半径 `neck_cells`**（默认 1）
          **腐蚀**空域断掉窄颈，再按 **6 连通**把剩下的空域标成**房间**，多源 BFS 把标签**填回**
          （每格取最近房间），两房标签**相接**的那层空格就是**开口**，按法向分组、
          给每扇 `Portal { quad, open = 1, regions: Some([小,大]) }`（`regions` = 两侧房间 id，升序）。
          顺序按格索引 ⇒ 逐位可复现；`Portal` 从 `lib.rs` 挪进本模块并加 `regions: Option<[u32;2]>`
          （作者手标的默认 `None` ⇒ A2 既有口径逐位不变）。
          判据 `tests/a10_portals.rs` 6 条：一格窄门在墙上 ⇒ 恰好两房 + 1 扇 portal（`regions = [0,1]`、
          法向轴居中）/ 墙封死 ⇒ 0 / 宽于 `2·neck` 的开口把两房并成一房 ⇒ 0 / `neck_cells = 0` 永不分裂 ⇒ 0 /
          两跑逐位一致 / **识别出的 portal 直接驱动 A2 的穿孔路径**（同平面墙挡住直线、门心在墙上 ⇒
          `portals ≥ 1`；撤掉 portal ⇒ 0）。⚠️ 边界：只吃**占据位**（不读 `World`、不看碰撞体），
          `neck_cells` 是唯一旋钮（宽/窄语义由它定）。
      - id: cli_wired
        note: >-
          **工具链已接（2026-10-11）**：`vxl-phys-cli acoustic <voxel> [ticks]` 打声学路径流（JSONL，
          与感官域的 `cue` 同款 ⇒ 直接进 `record / replay` 的跨机器对拍）；声学几何是**声明的"房间"**
          （地板 + `z = 1.5` 的墙 + 门洞），与碰撞体无关；听者站墙外侧 ⇒ 门洞路径 vs 墙透射约 **40×**。
          判据 `crates/vxl-phys-cli/tests/cli.rs`。
