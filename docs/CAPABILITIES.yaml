  # ── 验证能力：真实性基准不是"某个物理域"，但同样是本仓要长期守的能力 ──
  - id: PHY-SCOPE-REALISM-BENCH
    title: 真实性基准（R1–R10：能量 / 弹性 / 接触力 / 穿透 / 质量比 / 关节 / 流体体积 / 睡眠位置 / 破坏触发 / 堆叠载荷）
    scope: included
    implementation: implemented
    implementation_path: bench/realism-probe/src/bin/probe/main.rs
    evidence:
      - id: why_in_ci
        note: >-
          七个量初看是浮点量（不该进 CI），但实跑证明它们**跨 OS / CPU / 编译器逐字一致**
          （Windows 开发机与 Linux 沙箱双环境、rustc 1.97→1.99）⇒ 判据不依赖参考硬件，
          才收进 CI。顺序不可反：先在本机逐字复现外部基线，再拿它当基线；复现不了只能当报告项。
      - id: two_tiers
        note: >-
          不变量档（28 项阈值，守真实性不退化）进 PR 门；逐字档（--strict，与基线逐行相等）
          既做复现验证、又是"机器无关"这条前提的持续体检。计时类基准（bench/sweep_scale.py）
          不进 CI —— 那是 E-REF 报告项，与 gate_scale.sh 的 SCALE_TIME_REPORT 同口径。
      - id: gate
        note: >-
          scripts/gate_bench.sh（不变量 + 逐字）+ bench/baselines/realism.jsonl 基线；
          已接入 gate_all.sh 与 ci.yml 的 realism-bench job（进汇总门）。
      - id: quantified_defects
        note: >-
          这组量把三条**已量化**的真实性缺陷钉成可回归数字：R2 e=1 首弹能量保留（2026-10-09
          已修，0.7247 → 0.9531）；R5 高质量比静默互穿（2026-10-09 已修：first_fail_ratio
          20 → 1000，零换代）；R7 溃坝 Σm/ρ 体积偏 68.7%（2026-10-09 口径已分离：溃坝全程
          interior=0 ⇒ 全部是自由面核截断的口径，非引擎真误差；探针加 R7i 分报，零换代）。
          R2/R5 修掉后基线换代；R7 降级为已解释口径（OPEN-PROBLEMS P16）。
          另加 **R8 睡眠的位置代价**（2026-10-10，评审「方向 14」的真实性半边）：仓库此前只测
          入睡率/唤醒率、不测"睡眠把体冻在哪儿"；R8 两档同输入（睡眠开 / `sleep_time=+∞`）
          比末态逐体位置与姿态，并**要求 32 体全部入睡**（非空洞）。实测 32/32 入睡、
          max 9.66 mm / 0.214°。
          **R9 破坏触发的步精度与子步不变性**（2026-10-10，修的是一处真缺陷）：`impacts`
          旧实现每子步 `clear` 重记 ⇒ tick 级快照只剩**最后一个子步**，而快撞在第 1 个子步就
          被解掉 ⇒ 默认 2 子步下 12 m/s 撞击**一块碎块都挖不出**（1 子步档却挖 108 块——
          破坏结果取决于子步数）。改为**按 tick 取峰值**；R9 钉"解析触发 tick 对得上 +
          两档子步逐值相同 + 都挖得出 + 亚阈不触发"四条。
          **R10 多体堆叠的层间载荷方差**（2026-10-10，评审 §1.5 的 MISSING）：逐点冲量不暴露，
          改用"逐盒净力（速度差分）+ 逐层望远镜求和"拿层间载荷 ⇒ 稳住的 3 层堆均值误差
          0.0033%、波动 0.161%，而预热只给 2 s 时波动 12.79%（沉降时间这条特征一并钉住）。
    required_evidence:
      - implementation_path
      - ci_verification_path
    decision_id: null
    owner: maintainer
    notes: >-
      这不是"某个物理域"，而是跨域的验证能力；放在本表是为了让"真实性有没有自动门"这件事
      只有一个事实源。R1–R10 的定义与逐条读数见 bench/realism-probe（R8–R10 在
      `src/bin/probe/`）与 docs/KNOWLEDGE.md §M（R8/§R、R9/§T、R10/§U）。
