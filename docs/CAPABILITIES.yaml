# 能力 / 范围登记表（本仓的单一事实源）
#
# 存在理由（2026-10-08）：`SURVEY` 与 `ROUTE` 曾就同一件事给出相反状态 —— 面元力矩在
# `SURVEY` 写"按边界明确不含（不是漏）"、在 `ROUTE` 写"仍缺"，查下来两边说的其实是同一件
# 事的两半（刚体侧早就有实现和判据，布料侧有意不单列）。同类还有沙堆模型（三处写着"按用户
# 口径不做"，而里程碑出口判定里仍挂着它）。⇒ 状态从这里派生，各文档正文可独立解释、
# 但不得各自定义状态。
#
# 字段与规则取自《LSSMJ-CICD 完整审核与落地方案 · v5》§15.3（该文审的是 LSSMJ 仓库，但这一节
# 是明确写给"物理仓"即本仓的），本表把它落成可维护的形态：
#   scope          : included | excluded | unresolved —— 这件事是否在本仓范围内
#   implementation : absent | partial | coupled | unified | unknown
#                    仅当 scope=included 时有意义；`coupled` = 双向力交换但非同一求解系统。
#                    `partial` 是本仓在 §15.3 那四个值之外补的：它表示"部分落地"，
#                    比 `unknown` 准；`coupled` 仍然专指"耦合但非统一求解器"。
#   required_evidence : 判定所需的最小证据集；缺任一条 ⇒ 该条只能停在 unresolved
#   decision_id    : 拍板记录（ADR 号 / issue / PR）；`null` 表示尚无
#
# 规则（同 §15.3）：
#   · excluded + absent  = 设计边界（不是欠账，别再据此立项）
#   · included + absent  = 实现缺口（必须有任务、能力标记，以及失败/拒绝时的明确行为）
#   · unresolved         = 禁止"已支持/完成"宣称、禁止默认开启；也不必阻塞无关的错字修复
#   · 相近但不是一回事的能力用不同 id（例：`coupled` 与 `unified` 不能用同一个布尔值伪装等价）
#
# 维护：改这里的 scope/implementation 时，同步 `ROUTE.md` / `SURVEY-*.md` / 支持矩阵里引用本表的
# 状态段（正文解释可以不同，状态不许不同）。
#
# ⚠️ 本文件是 YAML，不是 Markdown。星号在 YAML 里是别名/锚点指示符 —— 值里出现就解析失败
#    （2026-10-08 建表与补登记时各踩一次，两次都是想写 Markdown 加粗或通配路径）。
#    ⇒ 字符串里不要用星号，也不要用 Markdown 记号；路径写成"某目录下所有 .rs"这种说法。
#    编辑后用解析器验一遍：
#      python -c "import yaml;yaml.safe_load(open('docs/CAPABILITIES.yaml',encoding='utf-8'))"
version: 1
updated: "2026-10-20"

capabilities:
  # ── 面元力矩：刚体侧与布料侧是两件事，分开登记（文档点名的例子） ──
  - id: PHY-SCOPE-SURFEL-TORQUE-RIGID
    title: 面元气动力矩（刚体 / TriMesh 侧）
    scope: included
    implementation: implemented
    implementation_path: crates/vxl-phys/src/world_step/aero.rs
    evidence:
      - id: impl_site
        note: 逐面 t_sum += (center - pos).cross(f)（力臂叉积，aero.rs）
      - id: tests
        note: crates/vxl-phys/tests/aero_face_torque.rs（4 条：静力矩闭式逐位 / 力臂线性标度 / 动力学方向 / 金丝雀）
      - id: session_record
        note: docs/SESSION-2026-09-28-TRIANGLE-CLOTH.md 第 25 行（"刚体侧早就在逐面施加 τ，缺的是判据"）
    required_evidence:
      - implementation_path
      - tests
    decision_id: null
    owner: maintainer
    notes: >
      v5 §15.4 另列了一组合同级验证。除"纯力偶"（本接口不表达该量，见 contract_coverage 的
      not_applicable 条）外，其余四项已于 2026-10-08 落地到 contract_tests。
    contract_tests: crates/vxl-phys/tests/aero_torque_contract.rs
    contract_coverage:
      - id: symmetric_zero_net_torque
        status: covered
        note: 两块同尺寸板关于 yz 面对称 ⇒ 每面力相同、力臂 x 相消 ⇒ 净矩 ≈ 0
      - id: reference_point_transform
        status: covered
        note: τ_c = τ₀ − c × ΣF，且与独立重算的 Σ(p_i − c) × F_i 一致
      - id: rigid_rotation_covariance
        status: covered
        note: 场景连风一起绕 z 转 90° ⇒ τ 向量同步旋转
      - id: reaction_applied_once
        status: covered
        note: 稳态下逐 tick 快照逐位相同（若在子步/迭代/帧间重复累计会单调增长）
      - id: pure_couple_zero_force_nonzero_torque
        status: not_applicable
        reason: >
          face_force 是纯阻力（F ∥ u，见 vxl-phys-aero/src/face.rs），力向只随相对风流向；
          升力项双面自洽（n → −n ⇒ 力不变）⇒ 接口不表达力偶。按 §15.4 自己的口径
          （"若范围排除力矩，拒绝请求或返回明确 unsupported，禁止悄悄扔掉切向/转动项"），
          这里如实登记为不适用，而不是假装验过。

