      - id: gap_layers
        note: >
          ROUTE §3.1 的"三层用法"里：① 渲染桥与反向导入 已落、③ 隐式场（Provider / MediumField）
          已落、② 物理代理**部分落地**（2026-10-08：`particles::step_particles` 运动步 ——
          重力积分 + 世界碰撞的非弹性投影，半径用椭球支撑半径；判据见
          `tests/splat_particles.rs`；同日第二片 `pressure::apply_self_pressure` 自场压力 ——
          Tait 斥力 + 逐对反对称动量守恒，判据见 `tests/splat_pressure.rs`；同日第三片
          `viscosity::apply_self_viscosity` 自场黏性 —— XSPH 对称形式、只耗散、等速度逐位不动，
          判据见 `tests/splat_viscosity.rs`）⇒ 对称 SPH 动量方程（压力 + 黏性）齐；同日第四片
          **门面接线**：`dynamics::SplatDynamics` 挂在场上，`World::step` 的体子步跑
          `world_step/splat_dynamics::pass`（借出场 → 跑 → 放回；接口 = 带 skin 的
          `ProviderColliders`），判据 `src/tests/splat_dynamics.rs`（真体素地板静置 / 关档逐位不动）；
          同日第五片 **内聚**：`SelfPressure::cohesion`（Pa，默认 0 = 关；显式吸引偏置，平衡密度
          `p(ρ) = cohesion` 解析可算），判据见 `tests/splat_pressure.rs`（0.9/1.1·d_eq 符号翻转 +
          自由演化收敛到 d_eq + 不等质量动量守恒）；
          **候选结构已落地（2026-10-09）**：bin = √cut·**中位**核半径 + 逐核各向异性登记；
          `step_dynamics` **每步开头重建一次**（上一步积分末尾把网格置脏）⇒ 世界路径的压力/黏性
          真的吃到候选表：完整动力学步实测局部云 n=1600 **约 3.7–3.8×**（两次复测）、稠密云 0.99–1.15×（无局部性
          时不亏）。收益是**局部性**的函数，见 KNOWLEDGE §I。**仍未做**：id 表缓存。
      - id: mass_reading_gap
        note: >
          质量口径**已定案（2026-10-08，P11 关闭）**：质量 = 介质密度场的**积分质量**
          `ρ_medium·opacity·(2π)^{3/2}·σx·σy·σz`（`Splat::mass`，flow 的动量分摊与状态桥
          共用这一处）；`opacity` 回到"密度场权重"的身份。判据：桥的动量账 == 沉积账、
          144³ 数值积分对拍解析值、派生量篡改被拒、默认档逐位不变。
          ⇒ ②物理代理的**前置口径不再阻塞**（粒子质量有了单一来源）。
