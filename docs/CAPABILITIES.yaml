  - id: PHY-SCOPE-M6-SAIL
    title: 默认铆内的帆面推进（船体 + 竖直帆 + 顺风漂移）
    scope: included
    implementation: covered
    implementation_path: crates/vxl-phys/examples/m6_float_sail.rs
    evidence:
      - id: gold_sample
        note: >
          `examples/m6_float_sail.rs` + `scripts/gate_gold.sh`（配方 `720`）。四项判据（`f32` 位模式）：
          粒子数守恒 / 顺风档末态船心 `x, y` / 零风档末态船心 `x, y`，以及最关键的第四条
          —— **顺风档 `x` 严格大于零风档**（差分判据，这才是“风真的推了船”）。
      - id: honesty_note
        note: >
          **判据为什么是差分而不是“零风档 x ≡ 0”**：实测零风档也会漂 `+0.1094`，
          来源是水块铸装沉降的推力 + 帆把质心抬高后的姿态扰动，两者都不是风。
          摸高船体只能让伪影改号。所以两档都冻结成基线，只认两档之差。
      - id: ci_verification_path
        note: Linux CI（金样 job）+ 本地 `bash scripts/gate_gold.sh` 双通过（2026-10-17）。
    required_evidence:
      - implementation_path
      - ci_verification_path
    decision_id: null
    owner: maintainer
    notes: >
      结构：体素水槽 + 船体（长条轻盒，密度 300）+ 竖直三角面板帆（法线沿 ±x）+ 固定桧杆。
      风对帆面的作用走面元气动（`F = ½ρCdA·u·|u|`），经固定关节带动船体。

  - id: PHY-SCOPE-M6-WHEELED
    title: 车辆地面行驶的确定性金样（车身 + 球轮 + 转动关节）
