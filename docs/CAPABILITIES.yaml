    scope: included
    implementation: implemented
    implementation_path: crates/vxl-phys-soft/src/cloth_edge_friction.rs
    evidence:
      - id: tests
        note: 模块内单测 4 条 + crates/vxl-phys-soft/tests/cloth_self_edge_friction.rs 2 条
    required_evidence:
      - implementation_path
      - tests
    decision_id: "#147"
    owner: maintainer
    notes: >
      复用同一个 `μ`（`SelfCollision::friction`，默认 0 = 关）。集成级"摩擦显著拖住滑移"的判据
      未做（硬投影约束的接触是间歇的 ⇒ 信噪比不足），已在测试头注如实登记。

  # ── 文献里被否证/明确不做的：登记成设计边界，防止"据此立项" ──
  - id: PHY-SCOPE-VOXEL-TO-PARTICLE
    title: 体素 → 粒子（沙 / 尘）
    scope: excluded
    implementation: absent
    implementation_path: null
    evidence:
      - id: user_decision
        note: 用户明确口径"不做"；`PLAN-0.2.md` §附录B、`ROUTE.md` §8 残留段与 §2026-09-14 表三处同记
    required_evidence:
      - user_decision
    decision_id: null
    owner: maintainer
    notes: 别再据此立项（`ROUTE.md` 的 M3 出口判定曾挂着它，2026-10-07 已按此口径更正）。

  - id: PHY-SCOPE-GPU-CLOTH
    title: 布料的 GPU 档
    scope: included
    implementation: absent
    implementation_path: null
    evidence:
      - id: route_entry
        note: ROUTE.md M4 行列为缺口；仓库已有 vxl-phys-gpu（wgpu）但只覆盖流体档
    required_evidence:
      - implementation_path
      - ci_verification_path
    decision_id: null
    owner: maintainer
