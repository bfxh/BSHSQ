  - id: PHY-SCOPE-STATE-INHERITANCE
    title: 状态继承（换表示 / 换域时，物理状态从旧状态接过来）
    scope: included
    implementation: partial
    implementation_path: crates/vxl-phys-core/src/interop/bridge_state.rs
    evidence:
      - id: state_bridge
        note: >
          StateBridge 家族分两档：位置桥（流体的 fluid_access/state.rs、布片的 cloth_access.rs，
          2026-10-06 落地；导入连 prev 一起对齐）与状态桥（位置 + 速度 + 逐点质量：
          BridgeState + handoff 在 core，2026-10-08 落地），流体/布片/喷溅三域各自实现。
      - id: splat_bridge
        note: >
          喷溅侧补上接口层的导出/导入与反向导入（splat_access.rs；此前只有渲染用的
          export_splats 单向拷贝）。
      - id: momentum_criteria
        note: >
          动量连续性判据已落地：总动量 = M·u、绕质心角动量 = I·ω（独立用惯量张量算）、
          长度不符整体拒绝且一字不动、位置桥清速度的金丝雀（判据非恒真）。
          见 core/tests/bridge_state_ledger.rs、fluid/tests/state_inheritance.rs、
          soft/tests/cloth_state_inheritance.rs、splat/tests/splat_state_bridge.rs。
      - id: conflicting_record
        note: >
          PLAN-CONVERSION §3.3 的"交接策略三档"（(ii) 速度/角速度继承 + 质心修正、(iii) warm
          残量）在 2026-10-03 被标注为"按用户口径剔除"。⚠️ 这与用户 2026-10-08 的口述
          （"你只搞状态继承"）相反；本条按最新口述登记为 included。⚠️ 口径纠偏（2026-10-08）：
          已落地的是**同表示的状态搬运**（状态桥，见上条）；(ii) 的**跨表示**交接仍未落地，
          且碎片路径上"继承半速"早在 `apply_impact_destruction` 里被实测否证（能量源）⇒
          要做必须走动量守恒口径（`BridgeState` 的 p/L 账），不许重做半速。
      - id: gap_cross_representation
        note: >
          跨表示交接（体素片 → 刚体、布片 → 喷溅等）与"与手工建体逐位退化"对拍仍未落地 ——
          那是 PLAN-CONVERSION 的交接策略片（属"换表示"），与本条已落地的"同表示状态搬运"分开登记。
      - id: why_cross_representation_is_blocked
        note: >
          ⚠️ 2026-10-08 核查：跨表示交接**当前没有可继承的源状态** —— 转换窗口（V2）做的是
          体素 provider → 网格 provider 的**静态几何**替换（`world_step/conversion.rs`），源与目标都
          没有线/角速度；碎片路径的源是静态体素域，"继承撞击体半速"已被实测否证（能量源）。
          ⇒ 要做 (ii) 档，先得出现"**动态体换表示**"的场景（源体带运动状态），否则只会重做否证路线。
    required_evidence:
      - implementation_path
      - tests
    decision_id: null
    owner: maintainer
    notes: >
      判据草案（PLAN-CONVERSION §3.3）：|Δp| ≤ ε_m·|p|、|ΔL| ≤ ε_L·|L|、E_new ≤ E_old + ε，
      外加"与手工建体逐位退化"。本片做到"同表示的状态搬运"：动量位级往返 + 解析对拍
      （M·u / I·ω）；跨表示的质心修正与 warm 残量仍未做。

