        note: >
          `crates/vxl-phys/tests/joint_break.rs` 四条判据：`break_force = 0` 永不断（"无此功能"的
          等价性）/ 超阈即断且**永久** / 阈内不断且关节照常拉住 / 断后不再施加任何约束。
      - id: gold_sample
        note: >
          `examples/m6_float_mooring.rs` + `scripts/gate_gold.sh`（配方 `720`）：同一场景两个子场景
          （被拉住 `y = 1.30` / 被扯断后浮到水面 `y = 1.21`），末态 `y` / `v_y` 的 `f32` 位模式逐位，
          并各自断言断裂标志 —— 把"功能有效"与"数值逐位可复现"一起钉住。
      - id: semantics
        note: >
          `break_force <= 0` = 不断（默认）⇒ **逐位等价**于无此功能（照抄 `motor_max_force <= 0` 的
          约定）；判据 = 本子步最大约束力（冲量 / `dt`），在解完之后统一判一次 ⇒ 与迭代数无关；
