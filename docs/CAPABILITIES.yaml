          `[0;BANDS]` = 纯镜面 ⇒ A1–A3 数值逐位不变）。分工是**能量守恒式**的：镜面那条按 `(1 - s_b)`
          打折，剩下的由**漫反射二级声源**（新路径种类 `Scattered`）接手 ——
          `gain_b = s_b · cos_in · cos_out · A / (d1²·d2²)`（**工程口径**：面积 × 两个余弦 × 散射系数 /
          两段距离平方；不承诺辐射度单位，要真辐射度得离线烘焙）；法向朝声源那一侧、两个余弦 > 0、
