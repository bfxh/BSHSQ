          push_kinematic 与 push_static / push_dynamic 共用一个私有 push_raw（质量与惯量恒零）；
          门面 World::add_kinematic / set_kinematic_velocity（速度驱动）/ set_kinematic_target
          （位移驱动：按 config.dt 反算速度，tick 末落在目标处）。两者对非运动学体显式 assert 拒绝。
      - id: landings
