          （AABB 刷新、树代理移动、参与查询）；积分器推进其位置；岛规则放宽为"非静态 × 非静态"
          （A 档并岛，用户 2026-10-12 裁决）；sleep_pass 对运动学体直接跳过（引擎永不让它入睡）；
          CCD 目标集带上它的速度；软体代理的角速度带上它；health 的活跃计数含它。
      - id: tests
