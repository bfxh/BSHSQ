# gitleaks 允许清单（仅放行明确已知的误报，不削弱真实密钥扫描）。
#
# scripts/security_review.py 是「安全自审」门（security_review gate）自带的漏洞样例夹具：
# 内含故意注入的脆弱模式（SEC-01..SEC-NN，如 api_key = "..."、sk-...、eval/pickle/exec 等），
# 属预期内容，非真实密钥。整文件放行，避免 gitleaks 对自家夹具误红；该文件无真实凭据。
[extend]
use-default = true

[[paths-allowlist]]
description = "security_review.py 漏洞样例夹具（故意注入的脆弱模式，非真实密钥）"
paths = ['''scripts/security_review\.py''']
