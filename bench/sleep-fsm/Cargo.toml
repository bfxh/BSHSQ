[package]
name = "bshsq-sleep-fsm"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "睡眠/唤醒判据的三值（Kleene K3）阈值空间审计：不跑物理，只审判据"

