[package]
name = "vxl-phys-splat"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "vxl_phys 高斯喷溅域（渲染桥 + 物理代理 + 隐式等值面；见 docs/SPEC.md）"

[dependencies]
