[package]
name = "vxl-phys-sense"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "vxl_phys 感官输出域（声音/震动 cue：把求解已产生的事件归约成音频/触觉；只读，不改物理）"

[dependencies]
# 与其余域 crate 同款：版本与 path 由根 `[workspace.dependencies]` 一笔给（那里的注释已说明
# `version` 是给静态审计工具的）。此处若写成裸 `{ path = ... }`，cargo-deny 会判 wildcard。
#
# **只依赖门面**：本域是"输出侧"消费者（`docs/ROUTE.md` §3.2）——它读 `World` 的只读 API，
# 不碰任何内核 crate，也不给 `World` 加方法（走扩展 trait）。
vxl-phys = { workspace = true }
# 场景**事件源**：冲击记录只对 `Shape::Provider`（体素/网格/喷溅）接触产生
# （见 `World::record_impacts`）⇒ 工具链与判据的落地体必须是 provider。
vxl-phys-terrain = { workspace = true }
