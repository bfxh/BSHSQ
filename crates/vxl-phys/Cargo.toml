[package]
name = "vxl-phys"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "vxl_phys 门面：World 组装（默认管线 core+broad+narrow+solver+integrate+island）"

[dependencies]
vxl-phys-core = { workspace = true }
vxl-phys-broad = { workspace = true }
vxl-phys-narrow = { workspace = true }
vxl-phys-solver = { workspace = true }
vxl-phys-integrate = { workspace = true }
vxl-phys-field = { workspace = true }
vxl-phys-fluid = { workspace = true }
vxl-phys-aero = { workspace = true }
vxl-phys-terrain = { workspace = true }
vxl-phys-splat = { workspace = true }
# 破坏域（M3）：只做**策略**（冲量分级 / 碎片预算），机制侧在门面与体素里。
vxl-phys-destruction = { workspace = true }
vxl-phys-replay = { workspace = true }
# 软体域（绳索/T1）：门面只做装配与每 tick 推进，物理在 `vxl-phys-soft` 内。
vxl-phys-soft = { workspace = true }

[[example]]
name = "m0_pyramid"

[[example]]
name = "m0_bench"

[[example]]
name = "determinism"
